<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>情报卡参考图板（12 张）</title>
<style>
  body { background:#0d1117; color:#e6edf3; font-family:"Microsoft YaHei",sans-serif; margin:0; padding:24px; }
  h1 { font-size:20px; color:#58d5f7; }
  p.tip { color:#8b949e; font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); gap:20px; }
  figure { margin:0; background:#161b22; border:1px solid #30363d; border-radius:10px; overflow:hidden; }
  figure img { width:100%; display:block; cursor:zoom-in; }
  figure img:active { transform:scale(1.6); transform-origin:center; transition:transform .15s; position:relative; z-index:9; }
  figcaption { padding:10px 14px; font-size:13px; line-height:1.6; }
  figcaption b { color:#58d5f7; display:block; margin-bottom:4px; font-size:14px; }
  figcaption span { color:#c9a227; }
</style>
</head>
<body>
<h1>情报卡（CardInfoPanel）参考图板 · 12 张</h1>
<p class="tip">按住看大图：点击图片可临时放大。文件均在本目录，来源与借鉴点见 README.md。</p>
<div class="grid">
  <figure><img src="01_炉石传说_卡面框架_奥术飞弹.png"><figcaption><b>01 炉石传说 · 卡面框架</b>费用宝石悬浮角标 / 名称横幅 / 描述框 / 类型条<span>借鉴：能量·时代做成 header 宝石角标</span></figcaption></figure>

  <figure><img src="16_大战略千年帝国_单位面板_用户供图.png"><figcaption><b>16 大战略 · 千年帝国单位面板（用户供图 ★核心）</b>武装表按目标类型分列命中率(対車輌/対航空/対歩兵/対艦船/対基地)，不可攻击画"--"；兵器/移动类型双徽章；移動力/索敵力/FPW；武装変更 I~IV 槽<span>借鉴：对轻攻/对重攻/对装甲交叉表的鼻祖，克制关系的标准 UI 表达</span></figcaption></figure>
