name: Automated Tests

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'   # P3-7：现役集成分支（feat/v6.14-system-integration 等）也常跑门禁
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Run GdUnit4 Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run GdUnit4 Tests
        uses: MikeSchulze/gdUnit4-action@v1
        with:
          godot-version: '4.5'
          paths: |
            tests/unit
            tests/integration
          report-name: test-results

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/
