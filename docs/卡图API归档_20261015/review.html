<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>卡图 API 重生成 · 审查（2026-10-14）</title>
<style>
:root{--bg:#101418;--panel:#1a2027;--panel2:#232b34;--txt:#dbe4ee;--dim:#8b98a8;
  --line:#2d3742;--ok:#3fb96f;--bad:#e05c5c;--accent:#4aa8ff;--zoom:200px}
body.light{--bg:#eef1f5;--panel:#fff;--panel2:#f2f5f9;--txt:#1d2733;--dim:#5d6b7c;--line:#d5dce5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font:13px/1.5 "Microsoft YaHei",system-ui,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--panel);
  border-bottom:1px solid var(--line);padding:10px 16px}
h1{font-size:17px;margin:0 0 6px}
h1 small{color:var(--dim);font-weight:normal;margin-left:8px;font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar label{color:var(--dim)}
select,button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
  border-radius:6px;padding:4px 8px;font-size:12px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
main{padding:12px 16px 80px}
.row{display:flex;gap:14px;align-items:stretch;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.row .meta{flex:0 0 240px}
.nm{font-weight:bold;font-size:15px}
.iid{color:var(--dim);font-size:11px;font-family:Consolas,monospace;word-break:break-all;margin-top:2px}
.tags{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;border-radius:4px;padding:0 6px;background:var(--panel2);
  border:1px solid var(--line);color:var(--dim)}
.tag.err{color:var(--bad);border-color:var(--bad)}
.tag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.subj{margin-top:8px;font-size:11px;color:var(--dim);max-height:5.2em;overflow:auto;
  border-top:1px dashed var(--line);padding-top:6px}
.cols{flex:1;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.cell{display:flex;flex-direction:column;gap:4px}
.cell .cap{font-size:11px;color:var(--dim)}
.imgbox{width:var(--zoom);height:var(--zoom);border-radius:8px;overflow:hidden;
  border:1px solid var(--line);position:relative}
.imgbox img{width:100%;height:100%;object-fit:contain}
.imgbox.raw{background:#3c0f3c}
body.light .imgbox.raw{background:#c9a0c9}
.imgbox.chk{background:repeating-conic-gradient(var(--panel2) 0 25%, transparent 0 50%)
  0 0/22px 22px}
.imgbox.darkbg{background:#0b0e12}
.imgbox.lightbg{background:#f4f6f9}
.imgbox.none{display:flex;align-items:center;justify-content:center;color:var(--bad);font-size:11px}
.pinfo{font-size:11px;color:var(--dim);font-family:Consolas,monospace}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--panel);
  border-top:1px solid var(--line);padding:6px 16px;font-size:12px;color:var(--dim);z-index:20}
</style>
</head>
<body>
<header>
  <h1>卡图 API 重生成审查 <small id="gen"></small></h1>
  <div class="bar">
    <label>尺寸 <select id="selZoom">
      <option value="160">160</option><option value="200" selected>200</option>
      <option value="280">280</option><option value="380">380</option></select></label>
    <label>透明底 <select id="selBg">
      <option value="chk" selected>棋盘格</option><option value="darkbg">深色</option>
      <option value="lightbg">浅色</option></select></label>
    <label>底色 <select id="selTheme">
      <option value="dark" selected>深色</option><option value="light">浅色</option></select></label>
    <span style="color:var(--dim)">左=现役敌图 · 中=新图 raw(品红1024) · 右=键控后(透明512)</span>
  </div>
</header>
<main id="app"></main>
<footer>t2i 语义重出（不锁现役结构）· 骨架冻结+单变量 SUBJECT · 品红底键控对齐
magenta_cut_key_ref 口径 · 台账 ledger.json · 产物仅暂存，目检拍板后才部署</footer>
<script>
const DATA = {"generated": "2026-10-14 16:01:24", "rows": [{"no": "011", "name": "81mm迫击炮", "uid": "ww2_arty_m81", "era": "二战", "subject": "fully colored military illustration in rich olive-green and rust-brown palette with visible brushed-metal texture and paint chipping: an unmanned World War II automatic 81mm mortar facing left, the muzzle angled up toward the left edge of the image, on a stabilized base with ammunition drum and mechanical auto-loader arm", "icon": "../../assets/card_icons/enemy/vis_enemy_011.png", "raw": "raw/011·81mm迫击炮.png", "cut": "cut/011·81mm迫击炮.png", "secs": null, "content_frac": 0.84, "cut_note": null}, {"no": "012", "name": "81mm迫击炮组", "uid": "ww1_arty_m81", "era": "一战", "subject": "fully colored military illustration in multi-tone field-grey and weathered brass palette with rivets and gear details clearly painted: an unmanned World War I automatic trench mortar facing left, the muzzle angled up toward the left edge of the image, chain-fed ammunition belt and brass gear auto-loader on a riveted steel mount", "icon": "../../assets/card_icons/enemy/vis_enemy_012.png", "raw": "raw/012·81mm迫击炮组.png", "cut": "cut/012·81mm迫击炮组.png", "secs": null, "content_frac": 0.84, "cut_note": null}, {"no": "017", "name": "ZSU-23-4自行高炮", "uid": "cold_sup_zsu23", "era": "冷战", "subject": "a Soviet ZSU-23-4 Shilka self-propelled anti-aircraft gun: quad 23mm autocannon barrels clustered and pointing up-left atop a boxy turret with a raised dish radar, tracked chassis with five road wheels, dark olive green with worn edges", "icon": "../../assets/card_icons/enemy/vis_enemy_017.png", "raw": "raw/017·ZSU-23-4自行高炮.png", "cut": "cut/017·ZSU-23-4自行高炮.png", "secs": null, "content_frac": 0.84, "cut_note": null}, {"no": "019", "name": "M1A1主战坦克", "uid": "mod_arm_m1a1", "era": "现代", "subject": "fully colored military illustration in NATO green with dusty desert-tan streaks, worn track metal and painted hull panels: an M1A1 Abrams main battle tank facing left, the long 120mm gun barrel pointing straight toward the left edge of the image, low angular turret, side skirts and seven-spoke road wheels", "icon": "../../assets/card_icons/enemy/vis_enemy_019.png", "raw": "raw/019·M1A1主战坦克.png", "cut": "cut/019·M1A1主战坦克.png", "secs": null, "content_frac": 0.84, "cut_note": null}, {"no": "026", "name": "光棱坦克", "uid": "fut_arm_prism", "era": "未来", "subject": "a futuristic prism tank: sleek low-hover chassis in white ceramic composite armor, a tall crystalline focusing prism tower on the turret splitting into refractor nodes, glowing cyan-blue energy conduits along the hull", "icon": "../../assets/card_icons/enemy/vis_enemy_026.png", "raw": "raw/026·光棱坦克.png", "cut": "cut/026·光棱坦克.png", "secs": null, "content_frac": 0.84, "cut_note": null}, {"no": "030", "name": "泰坦Mk.II", "uid": "fut_arm_titan_mk2", "era": "未来", "subject": "the Titan Mk.II, a colossal armored war-walker platform on four heavy articulated legs, a bristling central hull mounting twin long-barreled rail cannons pointing left, layered gunmetal blue-grey plates with amber warning stripes", "icon": "../../assets/card_icons/enemy/vis_enemy_031.png", "raw": "raw/030·泰坦Mk.II.png", "cut": "cut/030·泰坦Mk.II.png", "secs": null, "content_frac": 0.84, "cut_note": null}, {"no": "032", "name": "重装母舰", "uid": "fut_air_heavy_carrier", "era": "未来", "subject": "fully colored military illustration in dark blue-grey armor panels with glowing cyan trim lights, engine exhaust glow and deck markings: a massive futuristic heavy airborne carrier facing left in full side view, broad flying-wing hull with rows of engine pods and an open launch bay deck lined with small drones", "icon": "../../assets/card_icons/enemy/vis_enemy_033.png", "raw": "raw/032·重装母舰.png", "cut": "cut/032·重装母舰.png", "secs": null, "content_frac": 0.84, "cut_note": null}, {"no": "037", "name": "机枪巢", "uid": "ww1_sup_mg_nest", "era": "一战", "subject": "fully colored military illustration in sun-bleached sandbag tan and olive-green metal, burlap weave texture, rivets and brass gears clearly painted: an unmanned automatic machine gun nest facing left, an auto-firing heavy machine gun on a mechanical stabilized mount with a belt-fed ammunition box and a clockwork auto-traverse mechanism, its water-cooled barrel pointing toward the left edge of the image, set inside a curved wall of stacked weathered sandbags", "icon": "../../assets/card_icons/enemy/vis_enemy_038.png", "raw": "raw/037·机枪巢.png", "cut": "cut/037·机枪巢.png", "secs": null, "content_frac": 0.84, "cut_note": null}, {"no": "038", "name": "迫击炮组", "uid": "ww1_arty_mortar", "era": "一战", "subject": "fully colored military illustration in blued-steel and mud-brown palette with scratches and rust streaks clearly painted: an unmanned compact light automatic trench mortar facing left, the muzzle angled up toward the left edge of the image, drum-magazine auto-feeder on a tripod base", "icon": "../../assets/card_icons/enemy/vis_enemy_039.png", "raw": "raw/038·迫击炮组.png", "cut": "cut/038·迫击炮组.png", "secs": null, "content_frac": 0.84, "cut_note": null}, {"no": "039", "name": "暴风突击队", "uid": "ww1_inf_storm_e", "era": "架空", "subject": "fully colored military illustration in muted grey-green combat fatigues with dark tactical gear, cloth folds and metal sheen clearly painted: a single elite assault trooper facing left, striding forward toward the left edge of the frame with his service rifle raised and carried at the ready, the muzzle pointing ahead-left, wearing a smooth rounded combat helmet and a chest rig with pouches", "icon": "../../assets/card_icons/enemy/vis_enemy_040.png", "raw": "raw/039·暴风突击队.png", "cut": "cut/039·暴风突击队.png", "secs": null, "content_frac": 0.596, "cut_note": null}]};
const app = document.getElementById('app');
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
for (const r of DATA.rows) {
  const row = document.createElement('div'); row.className = 'row';
  const cutBg = document.getElementById('selBg').value;
  row.innerHTML = `
    <div class="meta">
      <div class="nm">${esc(r.no + '·' + r.name)}</div>
      <div class="iid">${esc(r.uid)}</div>
      <div class="tags">
        <span class="tag">${esc(r.era)}</span>
        <span class="tag">${r.secs != null ? r.secs + 's' : ''}</span>
        ${r.raw ? '<span class="tag ok">raw OK</span>' : '<span class="tag err">生成失败</span>'}
        ${r.cut ? `<span class="tag ok">cut ${r.content_frac}</span>` : ''}
        ${r.cut_note ? `<span class="tag err">${esc(r.cut_note)}</span>` : ''}
      </div>
      <div class="subj">${esc(r.subject)}</div>
    </div>
    <div class="cols">
      <div class="cell"><div class="cap">现役敌图（不满意的结构参照）</div>
        <div class="imgbox chk"><img src="${r.icon}" loading="lazy"></div></div>
      <div class="cell"><div class="cap">新图 raw · 品红底 ${r.raw ? '' : '缺失'}</div>
        ${r.raw ? `<div class="imgbox raw"><img src="${r.raw}" loading="lazy"></div>`
                : '<div class="imgbox none">no image</div>'}</div>
      <div class="cell"><div class="cap">键控后 · 透明底 512</div>
        ${r.cut ? `<div class="imgbox ${cutBg}"><img src="${r.cut}" loading="lazy"></div>`
                : '<div class="imgbox none">no image</div>'}</div>
    </div>`;
  app.appendChild(row);
}
document.getElementById('gen').textContent = '生成 ' + DATA.generated;
document.getElementById('selZoom').onchange = e =>
  document.documentElement.style.setProperty('--zoom', e.target.value + 'px');
document.getElementById('selTheme').onchange = e =>
  document.body.classList.toggle('light', e.target.value === 'light');
document.getElementById('selBg').onchange = e => {
  for (const b of document.querySelectorAll('.imgbox.chk,.imgbox.darkbg,.imgbox.lightbg'))
    if (b.querySelector('img') && b.parentElement.textContent.includes('键控'))
      b.className = 'imgbox ' + e.target.value;
};
</script>
</body>
</html>
