let currentFilter = 'player';
let searchTerm = '';
let dragState = null;

const CW=150, CH=190, TEX_W=60, TEX_H=150;
const TEX_X=(CW-TEX_W)/2, TEX_TOP=10, TEX_BOT=TEX_TOP+TEX_H;

function getPoints(e) {
  // fireX 直接用原值（数据已在生成时镜像，红点 = 图中枪口位置）
  return {
    footY: TEX_BOT - e.ff * TEX_H,
    headY: TEX_TOP + e.hf * TEX_H,
    fireX: TEX_X + e.fireX * TEX_W,
    fireY: TEX_TOP + e.fireY_pct/100 * TEX_H,
    centerX: TEX_X + TEX_W/2
  };
}

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  let list = enemies;
  if (currentFilter === 'player') list = list.filter(function(e){ return !!e.is_real_player_card; });
  else if (currentFilter === 'miss') list = list.filter(function(e){ return !e.has_muzzle; });
  else if (currentFilter !== 'all') list = list.filter(function(e){ return e.era === currentFilter; });
  if (searchTerm) {
    const s = searchTerm.toLowerCase();
    list = list.filter(function(e){ return e.id.toLowerCase().includes(s) || e.name.toLowerCase().includes(s); });
  }
  list.forEach(e => {
    const idx = enemies.indexOf(e);
    const card = document.createElement('div');
    card.className = 'card' + (e.has_muzzle ? '' : ' miss');
    card.dataset.idx = idx;
    const badge = e.has_muzzle ? '<span class="hit-badge">有锚点</span>' : '<span class="miss-badge">需标注</span>';
    const iconHtml = e.icon
      ? `<img class="card-icon" src="${ICON_BASE}${e.icon}" alt="${e.name}" onerror="this.style.display='none'">`
      : `<div class="card-icon" style="display:flex;align-items:center;justify-content:center;font-size:8px;color:#555;transform:none">${e.id.slice(0,6)}</div>`;
    card.innerHTML =
      '<div class="card-header" style="border-top:2px solid ' + ERA_COLOR[e.era] + '">' +
        iconHtml +
        '<div class="card-info">' +
          '<div class="card-name">' + e.name + ' <span style="font-size:8px;color:' + ERA_COLOR[e.era] + '">' + e.era + '·' + e.wt + '</span>' + badge + '</div>' +
          '<div class="card-id">' + e.id + (e.vis ? ' · ' + e.vis : '') + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="canvas-wrap"><canvas id="cv' + idx + '" width="' + CW + '" height="' + CH + '"></canvas></div>' +
        '<div class="stats">' +
          '<div class="stat-row"><span class="stat-label">HP/射程</span><span class="stat-value">' + e.hp + ' / ' + e.rng + '</span></div>' +
          '<div class="stat-row"><span class="stat-label">开火Y</span><span class="stat-value" style="color:#ff6b6b" id="fy' + idx + '">' + e.fireY_pct.toFixed(1) + '%</span></div>' +
          '<div class="stat-row"><span class="stat-label">开火X</span><span class="stat-value" style="color:#ff6b6b" id="fx' + idx + '">' + (e.fireX*100).toFixed(0) + '%</span></div>' +
          '<div style="margin-top:3px">' +
            '<div class="edit-row"><label style="color:#50c878">脚ff</label><input type="number" step="0.001" min="0" max="1" value="' + e.ff.toFixed(3) + '" data-idx="' + idx + '" data-f="ff"></div>' +
            '<div class="edit-row"><label style="color:#50c878">头hf</label><input type="number" step="0.001" min="0" max="1" value="' + e.hf.toFixed(3) + '" data-idx="' + idx + '" data-f="hf"></div>' +
            '<div class="edit-row"><label style="color:#ff4040">开火Y%</label><input type="number" step="0.1" min="0" max="100" value="' + e.fireY_pct.toFixed(1) + '" data-idx="' + idx + '" data-f="fireY_pct"></div>' +
            '<div class="edit-row"><label style="color:#ff4040">开火X%</label><input type="number" step="1" min="0" max="100" value="' + (e.fireX*100).toFixed(0) + '" data-idx="' + idx + '" data-f="fireX"></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="card-footer">绿=脚/头 红=开火点(图朝左，红点=枪口) | ' + (e.vis ? '图:' + e.vis : '无卡图') + '</div>';
    grid.appendChild(card);
    setTimeout(function(){ draw(idx); }, 0);
  });

  document.querySelectorAll('canvas').forEach(function(cv) {
    const idx = parseInt(cv.id.replace('cv',''));
    cv.addEventListener('mousedown', function(ev){ startDrag(idx, ev, cv); });
    cv.addEventListener('touchstart', function(ev){ startDrag(idx, ev, cv); }, {passive:false});
  });
  document.onmousemove = onMove;
  document.onmouseup = endDrag;
  document.ontouchmove = onMove;
  document.ontouchend = endDrag;

  document.querySelectorAll('.edit-row input').forEach(function(inp) {
    inp.onchange = function(ev) {
      const t = ev.target;
      const idx = parseInt(t.dataset.idx);
      const f = t.dataset.f;
      const v = parseFloat(t.value);
      if (isNaN(v)) return;
      const e = enemies[idx];
      if (f === 'fireY_pct') e.fireY_pct = Math.max(0, Math.min(100, v));
      else if (f === 'fireX') e.fireX = Math.max(0, Math.min(1, v/100));
      else { if (v<0||v>1) return; e[f] = v; }
      e.has_muzzle = true;
      sync(idx); draw(idx);
      toast(e.name + ' 已更新');
    };
  });
}

function draw(idx) {
  const cv = document.getElementById('cv'+idx);
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const e = enemies[idx];
  ctx.clearRect(0,0,CW,CH);
  const p = getPoints(e);

  ctx.fillStyle = '#0d1117'; ctx.fillRect(0,0,CW,CH);

  const card = document.querySelector('.card[data-idx="'+idx+'"]');
  const img = card ? card.querySelector('.card-icon') : null;
  if (img && img.naturalWidth > 0) {
    const s = Math.min(TEX_W/img.naturalWidth, TEX_H/img.naturalHeight);
    const dw=img.naturalWidth*s, dh=img.naturalHeight*s;
    ctx.drawImage(img, TEX_X+(TEX_W-dw)/2, TEX_TOP+(TEX_H-dh)/2, dw, dh);
  }

  ctx.strokeStyle='#333'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
  ctx.strokeRect(TEX_X, TEX_TOP, TEX_W, TEX_H); ctx.setLineDash([]);

  ctx.fillStyle='rgba(80,200,120,0.06)'; ctx.fillRect(TEX_X, p.headY, TEX_W, p.footY-p.headY);
  ctx.strokeStyle='#50c878'; ctx.lineWidth=1; ctx.strokeRect(TEX_X, p.headY, TEX_W, p.footY-p.headY);

  ctx.fillStyle='#50c878'; ctx.font='8px sans-serif';
  ctx.fillText('脚'+e.ff.toFixed(2), TEX_X+TEX_W+3, p.footY+3);
  ctx.fillText('头'+e.hf.toFixed(2), TEX_X+TEX_W+3, p.headY+3);

  ctx.fillStyle='#ff6b6b'; ctx.font='bold 8px sans-serif';
  ctx.fillText('Y'+e.fireY_pct.toFixed(0), TEX_X+TEX_W+3, p.fireY-3);
  ctx.fillText('X'+(e.fireX*100).toFixed(0), TEX_X+TEX_W+3, p.fireY+7);

  ctx.fillStyle='#50c878'; ctx.beginPath(); ctx.arc(p.centerX, p.footY, 4, 0, 6.28); ctx.fill();
  ctx.strokeStyle='#0d1117'; ctx.lineWidth=1; ctx.stroke();
  ctx.beginPath(); ctx.arc(p.centerX, p.headY, 4, 0, 6.28); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#ff4040'; ctx.beginPath(); ctx.arc(p.fireX, p.fireY, 5, 0, 6.28); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();

  ctx.fillStyle = ERA_COLOR[e.era]; ctx.fillRect(0,0,2,CH);
}

function getCoord(ev, cv) {
  const r = cv.getBoundingClientRect();
  const cx = ev.clientX !== undefined ? ev.clientX : (ev.touches && ev.touches[0] ? ev.touches[0].clientX : 0);
  const cy = ev.clientY !== undefined ? ev.clientY : (ev.touches && ev.touches[0] ? ev.touches[0].clientY : 0);
  return { x:(cx-r.left)/r.width*CW, y:(cy-r.top)/r.height*CH };
}

function startDrag(idx, ev, cv) {
  const c = getCoord(ev, cv);
  const e = enemies[idx];
  const p = getPoints(e);
  const dFoot = Math.hypot(c.x-p.centerX, c.y-p.footY);
  const dHead = Math.hypot(c.x-p.centerX, c.y-p.headY);
  const dFire = Math.hypot(c.x-p.fireX, c.y-p.fireY);
  let type = null, best = 14;
  if (dFire < best) { best = dFire; type = 'fire'; }
  if (dFoot < best) { best = dFoot; type = 'ff'; }
  if (dHead < best) { best = dHead; type = 'hf'; }
  if (type) { dragState = {idx:idx, type:type, cv:cv}; ev.preventDefault(); }
}

function onMove(ev) {
  if (!dragState) return;
  const cv = dragState.cv;
  const c = getCoord(ev, cv);
  const e = enemies[dragState.idx];
  if (dragState.type === 'ff') {
    const v = Math.max(0, Math.min(1, (TEX_BOT-c.y)/TEX_H));
    if (Math.abs(v-e.ff)>0.0005) { e.ff = v; sync(dragState.idx); draw(dragState.idx); }
  } else if (dragState.type === 'hf') {
    const v = Math.max(e.ff, Math.min(1, (c.y-TEX_TOP)/TEX_H));
    if (Math.abs(v-e.hf)>0.0005) { e.hf = v; sync(dragState.idx); draw(dragState.idx); }
  } else if (dragState.type === 'fire') {
    // fireX 直接对应屏幕 X（红点所见即所得，已在我方朝左图上）
    const nx = Math.max(0, Math.min(1, (c.x-TEX_X)/TEX_W));
    const ny = Math.max(0, Math.min(100, (c.y-TEX_TOP)/TEX_H*100));
    if (Math.abs(nx-e.fireX)>0.003 || Math.abs(ny-e.fireY_pct)>0.1) {
      e.fireX = nx; e.fireY_pct = ny;
      e.has_muzzle = true;
      sync(dragState.idx); draw(dragState.idx);
    }
  }
  if (ev.cancelable) ev.preventDefault();
}

function endDrag() {
  if (dragState) { toast(enemies[dragState.idx].name + ' 已调整'); dragState = null; }
}

function sync(idx) {
  const card = document.querySelector('.card[data-idx="'+idx+'"]');
  if (!card) return;
  const e = enemies[idx];
  card.querySelector('input[data-f="ff"]').value = e.ff.toFixed(3);
  card.querySelector('input[data-f="hf"]').value = e.hf.toFixed(3);
  card.querySelector('input[data-f="fireY_pct"]').value = e.fireY_pct.toFixed(1);
  card.querySelector('input[data-f="fireX"]').value = (e.fireX*100).toFixed(0);
  const fy = document.getElementById('fy'+idx); if (fy) fy.textContent = e.fireY_pct.toFixed(1)+'%';
  const fx = document.getElementById('fx'+idx); if (fx) fx.textContent = (e.fireX*100).toFixed(0)+'%';
}

function filter(f) {
  currentFilter = f;
  document.querySelectorAll('.toolbar .btn').forEach(function(b){ b.classList.remove('active'); });
  event.target.classList.add('active');
  render();
}

function onSearch() {
  searchTerm = document.getElementById('search').value;
  render();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, 1500);
}

function exportJSON() {
  const d = JSON.stringify(enemies.map(function(e){ return {id:e.id, ff:e.ff, hf:e.hf, fireX:e.fireX, fireY_pct:e.fireY_pct}; }), null, 2);
  const blob = new Blob([d], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'player_fire_spawn.json'; a.click();
  toast('JSON 已导出');
}

function exportGD() {
  const NL = String.fromCharCode(10);
  const lines = ['# 我方卡开火点 - 来源：player_fire_spawn.html','# fireX: 0~1 (0=纹理左, 0.5=中, 1=右) 按我方卡图(朝左)枪口位置标注','# fireY_pct: 0~100 (占纹理顶部百分比)','# 我方卡图=敌原图水平翻转，本表 fireX 已转换为我方图坐标(可直接用于运行时，无需再镜像)','const PLAYER_MUZZLE: Dictionary = {'];
  enemies.forEach(function(e){
    lines.push('  "' + e.id + '": {"fireX": ' + e.fireX.toFixed(4) + ', "fireY_pct": ' + e.fireY_pct.toFixed(2) + '},');
  });
  lines.push('}');
  const blob = new Blob([lines.join(NL)], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'player_muzzle_anchors.gd'; a.click();
  toast('GDScript 已导出（' + enemies.length + ' 条）');
}

render();
</script>
</body>
</html>
