<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase War - 战斗界面优化设计稿</title>
    <style>
        /* 全局重置 & 字体 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 战斗容器 - 模拟游戏画面 */
        .battle-screen {
            width: 1200px;
            max-width: 100%;
            height: 800px;
            max-height: 90vh;
            background: radial-gradient(ellipse at center, #1a202a 0%, #0a0d13 100%);
            border-radius: 32px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
            padding: 24px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
        }

        /* ---- 顶部信息栏 ---- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
        }
        .phase-indicator {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            background: rgba(0, 200, 255, 0.15);
            padding: 6px 18px;
            border-radius: 40px;
            border: 1px solid rgba(0, 200, 255, 0.3);
            color: #7ad0ff;
            text-shadow: 0 0 12px rgba(0,200,255,0.3);
        }
        .timer {
            font-size: 1rem;
            color: #a0b4cc;
            background: rgba(255,255,255,0.05);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .action-count {
            color: #f5c542;
            font-weight: 500;
        }

        /* ---- 战斗主体（角色+战场） ---- */
        .battle-main {
            flex: 1;
            display: flex;
            gap: 24px;
            padding: 20px 0;
            min-height: 0;
        }

        /* 左侧：玩家队伍 */
        .ally-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(255,255,255,0.02);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .panel-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #6f8aa3;
            margin-bottom: 4px;
        }

        /* 角色卡片 */
        .character-card {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            padding: 10px 14px;
            border-left: 3px solid #4cafb0;
            transition: all 0.2s;
            cursor: default;
            position: relative;
        }
        .character-card:hover {
            background: rgba(255,255,255,0.08);
            transform: translateX(4px);
        }
        .character-card.enemy {
            border-left-color: #e05858;
        }
        .char-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2d3f52, #1a2632);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            margin-right: 14px;
            border: 2px solid rgba(255,255,255,0.1);
            flex-shrink: 0;
        }
        .char-info {
            flex: 1;
        }
        .char-name {
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
        }
        .char-name span {
            color: #8aa3bc;
            font-size: 0.7rem;
            font-weight: 400;
        }
        .hp-bar-container {
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .hp-bar {
            flex: 1;
            height: 6px;
            background: #2a3340;
            border-radius: 10px;
            overflow: hidden;
        }
        .hp-fill {
            height: 100%;
            background: linear-gradient(90deg, #4cafb0, #68d4d0);
            border-radius: 10px;
            width: 76%;
            transition: width 0.4s;
        }
        .hp-fill.danger {
            background: linear-gradient(90deg, #e05858, #f28b8b);
        }
        .hp-text {
            font-size: 0.7rem;
            min-width: 36px;
            text-align: right;
            color: #a0b4cc;
        }
        .status-icons {
            display: flex;
            gap: 4px;
            margin-left: 8px;
        }
        .status-icon {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            background: rgba(255, 200, 0, 0.2);
            border: 1px solid rgba(255, 200, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            color: #f5c542;
        }

        /* 中间：战场/特效区（装饰） */
        .battlefield {
            flex: 1.2;
            background: radial-gradient(circle at 30% 50%, rgba(60, 80, 120, 0.2), transparent 70%);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 1px dashed rgba(255,255,255,0.05);
        }
        .battlefield .vs-text {
            font-size: 3rem;
            font-weight: 800;
            color: rgba(255,255,255,0.03);
            letter-spacing: 12px;
            text-shadow: 0 0 30px rgba(0,200,255,0.1);
        }
        .battlefield .turn-indicator {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            color: #6f8aa3;
            background: rgba(0,0,0,0.5);
            padding: 6px 20px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* 右侧：敌方队伍 */
        .enemy-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(255,255,255,0.02);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.04);
        }

        /* ---- 底部操作栏 ---- */
        .action-bar {
            flex-shrink: 0;
            display: flex;
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.08);
            flex-wrap: wrap;
            align-items: center;
        }
        .skill-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: #e8edf5;
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 1 auto;
        }
        .skill-btn:hover {
            background: rgba(0, 200, 255, 0.15);
            border-color: rgba(0, 200, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,200,255,0.15);
        }
        .skill-btn:active {
            transform: scale(0.96);
        }
        .skill-btn .key-hint {
            font-size: 0.65rem;
            color: #6f8aa3;
            background: rgba(255,255,255,0.05);
            padding: 2px 8px;
            border-radius: 12px;
        }
        .skill-btn.primary {
            background: linear-gradient(135deg, #0077b6, #00a8e8);
            border-color: #00a8e8;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 168, 232, 0.2);
        }
        .skill-btn.primary:hover {
            box-shadow: 0 8px 30px rgba(0, 168, 232, 0.3);
            background: linear-gradient(135deg, #0088cc, #00b8f5);
        }
        .skill-btn.utility {
            background: rgba(255,255,255,0.04);
        }
        .action-log {
            margin-left: auto;
            font-size: 0.8rem;
            color: #6f8aa3;
            background: rgba(0,0,0,0.3);
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.05);
            max-width: 260px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ---- 响应式 ---- */
        @media (max-width: 900px) {
            .battle-screen {
                height: auto;
                padding: 16px;
            }
            .battle-main {
                flex-direction: column;
                gap: 16px;
            }
            .battlefield {
                min-height: 120px;
                padding: 16px;
            }
            .action-bar {
                flex-wrap: wrap;
                justify-content: center;
            }
            .action-log {
                margin-left: 0;
                max-width: 100%;
                white-space: normal;
            }
            .top-bar {
                flex-wrap: wrap;
                gap: 8px;
                justify-content: center;
            }
        }
        @media (max-width: 480px) {
            .character-card {
                flex-wrap: wrap;
                padding: 8px;
            }
            .char-avatar {
                width: 32px;
                height: 32px;
                font-size: 1rem;
            }
            .skill-btn {
                padding: 8px 14px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="battle-screen">
        <!-- 顶部：阶段、回合、行动点 -->
        <div class="top-bar">
            <div class="phase-indicator">⚔ PHASE 2 · 攻势</div>
            <div class="timer"><span class="action-count">⚡ 3 AP</span> · 回合 4/12</div>
            <div style="display:flex; gap:8px;">
                <span style="font-size:0.7rem; color:#6f8aa3; border:1px solid rgba(255,255,255,0.05); padding:4px 12px; border-radius:20px;">⚙ 设置</span>
                <span style="font-size:0.7rem; color:#6f8aa3; border:1px solid rgba(255,255,255,0.05); padding:4px 12px; border-radius:20px;">⏸ 暂停</span>
            </div>
        </div>

        <!-- 主体：我方 | 战场 | 敌方 -->
        <div class="battle-main">
            <!-- 我方 -->
            <div class="ally-panel">
                <div class="panel-title">◈ 我方队伍</div>
                <div class="character-card">
                    <div class="char-avatar">⚔</div>
                    <div class="char-info">
                        <div class="char-name">剑士·艾琳 <span>Lv.8</span></div>
                        <div class="hp-bar-container">
                            <div class="hp-bar"><div class="hp-fill" style="width:82%"></div></div>
                            <span class="hp-text">410/500</span>
                        </div>
                    </div>
                    <div class="status-icons">
                        <div class="status-icon">⚡</div>
                        <div class="status-icon">🛡</div>
                    </div>
                </div>
                <div class="character-card">
                    <div class="char-avatar">🔮</div>
                    <div class="char-info">
                        <div class="char-name">法师·莫甘 <span>Lv.9</span></div>
                        <div class="hp-bar-container">
                            <div class="hp-bar"><div class="hp-fill" style="width:45%"></div></div>
                            <span class="hp-text">180/400</span>
                        </div>
                    </div>
                    <div class="status-icons">
                        <div class="status-icon">💧</div>
                    </div>
                </div>
                <div class="character-card">
                    <div class="char-avatar">🏹</div>
                    <div class="char-info">
                        <div class="char-name">游侠·赛恩 <span>Lv.7</span></div>
                        <div class="hp-bar-container">
                            <div class="hp-bar"><div class="hp-fill" style="width:100%"></div></div>
                            <span class="hp-text">380/380</span>
                        </div>
                    </div>
                    <div class="status-icons"></div>
                </div>
            </div>

            <!-- 战场中心 -->
            <div class="battlefield">
                <div class="vs-text">⚔ VS ⚔</div>
                <div class="turn-indicator">▶ 行动中 · 剑士·艾琳</div>
            </div>

            <!-- 敌方 -->
            <div class="enemy-panel">
                <div class="panel-title">◈ 敌方部队</div>
                <div class="character-card enemy">
                    <div class="char-avatar">👹</div>
                    <div class="char-info">
                        <div class="char-name">恶魔统领 <span>Lv.10</span></div>
                        <div class="hp-bar-container">
                            <div class="hp-bar"><div class="hp-fill danger" style="width:34%"></div></div>
                            <span class="hp-text">170/500</span>
                        </div>
                    </div>
                    <div class="status-icons">
                        <div class="status-icon" style="background:rgba(200,0,0,0.2);border-color:rgba(200,0,0,0.3);color:#e05858;">🔥</div>
                    </div>
                </div>
                <div class="character-card enemy">
                    <div class="char-avatar">🐉</div>
                    <div class="char-info">
                        <div class="char-name">暗影龙兽 <span>Lv.6</span></div>
                        <div class="hp-bar-container">
                            <div class="hp-bar"><div class="hp-fill danger" style="width:68%"></div></div>
                            <span class="hp-text">340/500</span>
                        </div>
                    </div>
                    <div class="status-icons">
                        <div class="status-icon" style="background:rgba(100,0,200,0.2);border-color:rgba(100,0,200,0.3);color:#a855f7;">🌀</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部：技能栏 + 日志 -->
        <div class="action-bar">
            <button class="skill-btn primary">⚡ 斩击 <span class="key-hint">Q</span></button>
            <button class="skill-btn">🛡 防御 <span class="key-hint">W</span></button>
            <button class="skill-btn">🔥 烈焰斩 <span class="key-hint">E</span></button>
            <button class="skill-btn utility">💊 治疗 <span class="key-hint">R</span></button>
            <button class="skill-btn utility">🏃 撤退 <span class="key-hint">Esc</span></button>
            <div class="action-log">⚡ 剑士·艾琳 使用了 斩击 (伤害 89)</div>
        </div>
    </div>
</body>
</html>
