<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>废土战争UI优化稿</title>

<style>

*{
    box-sizing:border-box;
    font-family:"Microsoft YaHei";
}


body{
    margin:0;
    background:#08111c;
    color:white;
}


/* 游戏窗口 */

.game{

width:1200px;
height:700px;

margin:40px auto;

position:relative;

background:
linear-gradient(
rgba(5,15,25,.55),
rgba(5,15,25,.8)
),
url("battle.png");

background-size:cover;

border-radius:20px;

overflow:hidden;

box-shadow:
0 0 50px #000;

}



/* 顶部状态 */


.top{

height:70px;

display:flex;

align-items:center;

justify-content:center;

font-size:28px;

}


.level{

color:#7ee8ff;

}


/*资源*/


.resource{

position:absolute;

right:30px;
top:20px;

background:#142235;

padding:15px 25px;

border-radius:20px;

display:flex;

gap:25px;

}




/*左侧信息*/


.info{

position:absolute;

left:25px;
top:90px;

width:260px;


background:
rgba(10,20,35,.8);

border:

1px solid #22c7ff;


border-radius:15px;

padding:20px;

}



.info h3{

color:#38d9ff;

}


.bar{

height:10px;

background:#222;

border-radius:10px;

overflow:hidden;

}


.hp{

width:70%;

height:100%;

background:#00e676;

}




/* 战场单位 */


.unit{

position:absolute;

width:120px;

height:70px;

border:2px solid #19ff8a;

background:#162333;

border-radius:10px;

text-align:center;

padding-top:20px;

}


.u1{
left:380px;
bottom:230px;
}


.u2{
left:600px;
bottom:230px;
}


.enemy{

border-color:#ff4040;

left:850px;

}


/*伤害*/


.damage{

position:absolute;

color:red;

font-size:40px;

font-weight:bold;

animation:hit 1s infinite;

}


@keyframes hit{

0%{
transform:translateY(0);
opacity:1;
}

100%{
transform:translateY(-40px);
opacity:0;
}

}





/* 卡牌区域 */


.cards{

position:absolute;

bottom:90px;

left:260px;

right:260px;

height:120px;


display:flex;

gap:15px;

}



.card{

width:100px;

height:120px;


background:
linear-gradient(
#24384c,
#111b29
);


border:2px solid #667;

border-radius:12px;


display:flex;

align-items:center;

justify-content:center;


transition:.3s;

}


.card:hover{

transform:
translateY(-20px);

border-color:#00e5ff;

}



/*技能*/


.skill{

position:absolute;

right:40px;

bottom:100px;


display:flex;

gap:20px;

}


.skill div{


width:80px;
height:80px;

border-radius:50%;

background:#162a44;

border:3px solid #00d9ff;


display:flex;

align-items:center;

justify-content:center;

}





/*底部*/

.bottom{


position:absolute;

bottom:0;

height:70px;

width:100%;

background:#07101b;


display:flex;

justify-content:center;

gap:30px;

align-items:center;


}



button{

background:#10263a;

border:

1px solid #168aff;


color:white;

padding:12px 25px;

border-radius:10px;


}



</style>


</head>


<body>


<div class="game">


<div class="top">

<span class="level">
第49关
</span>

</div>


<div class="resource">

金币 1280

💎32

⚙

</div>



<div class="info">

<h3>
战斗状态
</h3>


<p>
我方单位：2/7
</p>


<p>
当前波次：
15/30
</p>


<p>
能量</p>


<div class="bar">

<div class="hp"></div>

</div>


</div>



<div class="unit u1">

我方坦克

</div>



<div class="unit u2">

炮兵

</div>


<div class="unit enemy">

敌军装甲

</div>


<div class="damage">

292

</div>



<div class="cards">


<div class="card">

77mm炮

</div>


<div class="card">

M270

</div>


<div class="card">

FT17

</div>


<div class="card">

维修

</div>


<div class="card">

EMP

</div>


</div>




<div class="skill">

<div>
⚡
</div>

<div>
🔥
</div>

</div>




<div class="bottom">


<button>
暂停
</button>


<button>
自动战斗
</button>


<button>
技能
</button>


<button>
卡组
</button>



</div>


</div>


</body>

</html>
