.card-body { display:flex; gap:8px; padding:6px 8px; }
.canvas-wrap { position:relative; flex-shrink:0; }
.canvas-wrap canvas { display:block; border-radius:3px; cursor:crosshair; background:#0d1117; touch-action:none; }
.stats { flex:1; min-width:0; font-size:9px; }
.stat-row { display:flex; justify-content:space-between; padding:1px 0; border-bottom:1px solid rgba(255,255,255,0.04); }
.stat-label { color:#8892a4; }
.stat-value { font-weight:600; }

.formula { text-align:center; color:#8892a4; font-size:10px; padding:4px 14px; line-height:1.5; }

const PLAYER_ICON_BASE = '../assets/card_icons/player/';
const ENEMY_ICON_BASE = 'enemy_fire_icons/';
const ERA_COLOR = {一战:'#a08060',二战:'#80a060',冷战:'#6080c0',现代:'#c08060',近未来:'#c060c0'};

let currentSide = 'player';
let currentFilter = 'all';
let searchTerm = '';
let dragState = null;

const CW=150, CH=190, TEX_W=60, TEX_H=150;
const TEX_X=(CW-TEX_W)/2, TEX_TOP=10, TEX_BOT=TEX_TOP+TEX_H;

document.getElementById('pCount').textContent = ALL.player.length;
document.getElementById('eCount').textContent = ALL.enemy.length;

function getList() { return currentSide === 'player' ? ALL.player : ALL.enemy; }
function iconBase() { return currentSide === 'player' ? PLAYER_ICON_BASE : ENEMY_ICON_BASE; }

function switchSide(side) {
  currentSide = side;
  currentFilter = 'all';
  searchTerm = '';
  document.getElementById('search').value = '';
  document.getElementById('tabPlayer').className = 'tab' + (side==='player'?' active-p':'');
  document.getElementById('tabEnemy').className = 'tab' + (side==='enemy'?' active-e':'');
  document.querySelectorAll('.toolbar .btn').forEach(function(b){ if(b.id!=='missBtn') b.classList.remove('active'); });
  document.querySelector('.toolbar .btn').classList.add('active');
  var hint = document.getElementById('sideHint');
  if (side === 'player') {
    hint.innerHTML = '<b style="color:#3ce66c">我方卡</b>：图朝左（敌原图翻转），fireX 已镜像，红点=图中枪口位置。同名卡从敌方继承默认值。';
  } else {
    hint.innerHTML = '<b style="color:#f06666">敌方卡</b>：图朝右（原图），fireX 直接用，红点=图中枪口位置。全部已标注。';
  }
  render();
}

function getPoints(e) {
  return {
    footY: TEX_BOT - e.ff * TEX_H,
    headY: TEX_TOP + e.hf * TEX_H,
    fireX: TEX_X + e.fireX * TEX_W,
    fireY: TEX_TOP + e.fireY_pct/100 * TEX_H,
    centerX: TEX_X + TEX_W/2
  };
}

function render() {
  var list = getList();
  if (currentFilter === 'miss') list = list.filter(function(e){ return !e.has_muzzle; });
  else if (currentFilter !== 'all') list = list.filter(function(e){ return e.era === currentFilter; });
  if (searchTerm) {
    var s = searchTerm.toLowerCase();
    list = list.filter(function(e){ return e.id.toLowerCase().indexOf(s)>=0 || String(e.name).toLowerCase().indexOf(s)>=0; });
  }
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  var fullList = getList();
  list.forEach(function(e){
    var idx = fullList.indexOf(e);
    var card = document.createElement('div');
    card.className = 'card' + (e.has_muzzle ? '' : ' miss');
    card.dataset.idx = idx;
    var badge = e.has_muzzle ? '<span class="hit-badge">有锚点</span>' : '<span class="miss-badge">需标注</span>';
    var src = e.icon ? iconBase() + e.icon : '';
    var iconHtml = src
      ? '<img class="card-icon" src="' + src + '" alt="' + e.name + '" onerror="this.style.display=\'none\'">'
      : '<div class="card-icon" style="display:flex;align-items:center;justify-content:center;font-size:8px;color:#555">' + e.id.slice(0,6) + '</div>';
    var eraC = ERA_COLOR[e.era] || '#666';
    card.innerHTML =
      '<div class="card-header" style="border-top:2px solid ' + eraC + '">' +
        iconHtml +
        '<div class="card-info">' +
          '<div class="card-name">' + e.name + ' <span style="font-size:8px;color:' + eraC + '">' + e.era + '·' + e.wt + '</span>' + badge + '</div>' +
          '<div class="card-id">' + e.id + (e.vis?' · '+e.vis:'') + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="canvas-wrap"><canvas id="cv' + idx + '" width="' + CW + '" height="' + CH + '"></canvas></div>' +
        '<div class="stats">' +
          '<div class="stat-row"><span class="stat-label">HP/射程</span><span class="stat-value">' + e.hp + ' / ' + e.rng + '</span></div>' +
          '<div class="stat-row"><span class="stat-label">开火Y</span><span class="stat-value" style="color:#ff6b6b" id="fy' + idx + '">' + e.fireY_pct.toFixed(1) + '%</span></div>' +
          '<div class="stat-row"><span class="stat-label">开火X</span><span class="stat-value" style="color:#ff6b6b" id="fx' + idx + '">' + (e.fireX*100).toFixed(0) + '%</span></div>' +
          '<div style="margin-top:3px">' +
            '<div class="edit-row"><label style="color:#50c878">脚ff</label><input type="number" step="0.001" min="0" max="1" value="' + e.ff.toFixed(3) + '" data-idx="' + idx + '" data-f="ff"></div>' +
            '<div class="edit-row"><label style="color:#50c878">头hf</label><input type="number" step="0.001" min="0" max="1" value="' + e.hf.toFixed(3) + '" data-idx="' + idx + '" data-f="hf"></div>' +
            '<div class="edit-row"><label style="color:#ff4040">开火Y%</label><input type="number" step="0.1" min="0" max="100" value="' + e.fireY_pct.toFixed(1) + '" data-idx="' + idx + '" data-f="fireY_pct"></div>' +
            '<div class="edit-row"><label style="color:#ff4040">开火X%</label><input type="number" step="1" min="0" max="100" value="' + (e.fireX*100).toFixed(0) + '" data-idx="' + idx + '" data-f="fireX"></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="card-footer">绿=脚/头 红=开火点 | ' + (e.vis?'图:'+e.vis:'无卡图') + '</div>';
    grid.appendChild(card);
    setTimeout(function(){ draw(idx); }, 0);
  });

  document.querySelectorAll('canvas').forEach(function(cv){
    var idx = parseInt(cv.id.replace('cv',''));
    cv.addEventListener('mousedown', function(ev){ startDrag(idx, ev, cv); });
    cv.addEventListener('touchstart', function(ev){ startDrag(idx, ev, cv); }, {passive:false});
  });
  document.onmousemove = onMove;
  document.onmouseup = endDrag;
  document.ontouchmove = onMove;
  document.ontouchend = endDrag;

  document.querySelectorAll('.edit-row input').forEach(function(inp){
    inp.onchange = function(ev){
      var t = ev.target;
      var idx = parseInt(t.dataset.idx);
      var f = t.dataset.f;
      var v = parseFloat(t.value);
      if (isNaN(v)) return;
      var e = getList()[idx];
      if (f === 'fireY_pct') e.fireY_pct = Math.max(0, Math.min(100, v));
      else if (f === 'fireX') e.fireX = Math.max(0, Math.min(1, v/100));
      else { if (v<0||v>1) return; e[f] = v; }
      e.has_muzzle = true;
      sync(idx); draw(idx);
      toast(e.name + ' 已更新');
    };
  });
}

function draw(idx) {
  var cv = document.getElementById('cv'+idx);
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var e = getList()[idx];
  ctx.clearRect(0,0,CW,CH);
  var p = getPoints(e);
  ctx.fillStyle = '#0d1117'; ctx.fillRect(0,0,CW,CH);
  var card = document.querySelector('.card[data-idx="'+idx+'"]');
  var img = card ? card.querySelector('.card-icon') : null;
  if (img && img.naturalWidth > 0) {
    var s = Math.min(TEX_W/img.naturalWidth, TEX_H/img.naturalHeight);
    var dw=img.naturalWidth*s, dh=img.naturalHeight*s;
    ctx.drawImage(img, TEX_X+(TEX_W-dw)/2, TEX_TOP+(TEX_H-dh)/2, dw, dh);
  }
  ctx.strokeStyle='#333'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
  ctx.strokeRect(TEX_X, TEX_TOP, TEX_W, TEX_H); ctx.setLineDash([]);
  ctx.fillStyle='rgba(80,200,120,0.06)'; ctx.fillRect(TEX_X, p.headY, TEX_W, p.footY-p.headY);
  ctx.strokeStyle='#50c878'; ctx.lineWidth=1; ctx.strokeRect(TEX_X, p.headY, TEX_W, p.footY-p.headY);
  ctx.fillStyle='#50c878'; ctx.font='8px sans-serif';
  ctx.fillText('脚'+e.ff.toFixed(2), TEX_X+TEX_W+3, p.footY+3);
  ctx.fillText('头'+e.hf.toFixed(2), TEX_X+TEX_W+3, p.headY+3);
  ctx.fillStyle='#ff6b6b'; ctx.font='bold 8px sans-serif';
  ctx.fillText('Y'+e.fireY_pct.toFixed(0), TEX_X+TEX_W+3, p.fireY-3);
  ctx.fillText('X'+(e.fireX*100).toFixed(0), TEX_X+TEX_W+3, p.fireY+7);
  ctx.fillStyle='#50c878'; ctx.beginPath(); ctx.arc(p.centerX, p.footY, 4, 0, 6.28); ctx.fill();
  ctx.strokeStyle='#0d1117'; ctx.lineWidth=1; ctx.stroke();
  ctx.beginPath(); ctx.arc(p.centerX, p.headY, 4, 0, 6.28); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#ff4040'; ctx.beginPath(); ctx.arc(p.fireX, p.fireY, 5, 0, 6.28); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle = ERA_COLOR[e.era]||'#666'; ctx.fillRect(0,0,2,CH);
}

function getCoord(ev, cv) {
  var r = cv.getBoundingClientRect();
  var cx = ev.clientX !== undefined ? ev.clientX : (ev.touches && ev.touches[0] ? ev.touches[0].clientX : 0);
  var cy = ev.clientY !== undefined ? ev.clientY : (ev.touches && ev.touches[0] ? ev.touches[0].clientY : 0);
  return { x:(cx-r.left)/r.width*CW, y:(cy-r.top)/r.height*CH };
}

function startDrag(idx, ev, cv) {
  var c = getCoord(ev, cv);
  var e = getList()[idx];
  var p = getPoints(e);
  var dFoot = Math.hypot(c.x-p.centerX, c.y-p.footY);
  var dHead = Math.hypot(c.x-p.centerX, c.y-p.headY);
  var dFire = Math.hypot(c.x-p.fireX, c.y-p.fireY);
  var type = null, best = 14;
  if (dFire < best) { best = dFire; type = 'fire'; }
  if (dFoot < best) { best = dFoot; type = 'ff'; }
  if (dHead < best) { best = dHead; type = 'hf'; }
  if (type) { dragState = {idx:idx, type:type, cv:cv}; ev.preventDefault(); }
}

function onMove(ev) {
  if (!dragState) return;
  var cv = dragState.cv;
  var c = getCoord(ev, cv);
  var e = getList()[dragState.idx];
  if (dragState.type === 'ff') {
    var v = Math.max(0, Math.min(1, (TEX_BOT-c.y)/TEX_H));
    if (Math.abs(v-e.ff)>0.0005) { e.ff = v; sync(dragState.idx); draw(dragState.idx); }
  } else if (dragState.type === 'hf') {
    var v2 = Math.max(e.ff, Math.min(1, (c.y-TEX_TOP)/TEX_H));
    if (Math.abs(v2-e.hf)>0.0005) { e.hf = v2; sync(dragState.idx); draw(dragState.idx); }
  } else if (dragState.type === 'fire') {
    var nx = Math.max(0, Math.min(1, (c.x-TEX_X)/TEX_W));
    var ny = Math.max(0, Math.min(100, (c.y-TEX_TOP)/TEX_H*100));
    if (Math.abs(nx-e.fireX)>0.003 || Math.abs(ny-e.fireY_pct)>0.1) {
      e.fireX = nx; e.fireY_pct = ny; e.has_muzzle = true;
      sync(dragState.idx); draw(dragState.idx);
    }
  }
  if (ev.cancelable) ev.preventDefault();
}

function endDrag() {
  if (dragState) { toast(getList()[dragState.idx].name + ' 已调整'); dragState = null; }
}

function sync(idx) {
  var card = document.querySelector('.card[data-idx="'+idx+'"]');
  if (!card) return;
  var e = getList()[idx];
  card.querySelector('input[data-f="ff"]').value = e.ff.toFixed(3);
  card.querySelector('input[data-f="hf"]').value = e.hf.toFixed(3);
  card.querySelector('input[data-f="fireY_pct"]').value = e.fireY_pct.toFixed(1);
  card.querySelector('input[data-f="fireX"]').value = (e.fireX*100).toFixed(0);
  var fy = document.getElementById('fy'+idx); if (fy) fy.textContent = e.fireY_pct.toFixed(1)+'%';
  var fx = document.getElementById('fx'+idx); if (fx) fx.textContent = (e.fireX*100).toFixed(0)+'%';
}

function filter(f) {
  currentFilter = f;
  document.querySelectorAll('.toolbar .btn').forEach(function(b){ b.classList.remove('active'); });
  event.target.classList.add('active');
  render();
}

function onSearch() {
  searchTerm = document.getElementById('search').value;
  render();
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, 1500);
}

function exportJSON() {
  var side = currentSide === 'player' ? '我方' : '敌方';
  var d = JSON.stringify(getList().map(function(e){ return {id:e.id, ff:e.ff, hf:e.hf, fireX:e.fireX, fireY_pct:e.fireY_pct}; }), null, 2);
  var blob = new Blob([d], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = (currentSide==='player'?'player':'enemy') + '_fire_spawn.json'; a.click();
  toast(side + ' JSON 已导出（' + getList().length + ' 条）');
}

function exportGD() {
  var side = currentSide === 'player' ? '我方' : '敌方';
  var NL = String.fromCharCode(10);
  var dictName = currentSide === 'player' ? 'PLAYER_MUZZLE' : 'MUZZLE';
  var lines = ['# ' + side + '卡开火点 - 来源：敌我整合标注工具',
    '# fireX: 0~1 (0=纹理左, 0.5=中, 1=右)',
    '# fireY_pct: 0~100 (占纹理顶部百分比)',
    currentSide==='player' ? '# 注意：我方卡图朝左，fireX 按图中枪口位置（运行时需镜像回敌方坐标或直接用于PLAYER_MUZZLE）' : '# 敌方原图朝右，fireX 直接用',
    'const ' + dictName + ': Dictionary = {'];
  getList().forEach(function(e){
    lines.push('  "' + e.id + '": {"fireX": ' + e.fireX.toFixed(4) + ', "fireY_pct": ' + e.fireY_pct.toFixed(2) + '},');
  });
  lines.push('}');
  var blob = new Blob([lines.join(NL)], {type:'text/plain'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = (currentSide==='player'?'player_':'') + 'muzzle_anchors.gd'; a.click();
  toast(side + ' GDScript 已导出（' + getList().length + ' 条）');
}

// 初始化
switchSide('player');
</script>
</body>
