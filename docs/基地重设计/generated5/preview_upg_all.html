<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>15 房间「时代升级态」全量预览</title>
<style>
  body { background:#14100c; color:#cfd6e0; font-family:system-ui,sans-serif; padding:24px; }
  h1 { font-size:18px; color:#9fd8ff; }
  .note { font-size:13px; color:#b8a98a; max-width:1000px; line-height:1.7; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(430px,1fr)); gap:20px; margin-top:16px; }
  figure { margin:0; }
  figcaption { font-size:13px; color:#8a93a3; margin-bottom:6px; }
  .pair { display:flex; gap:8px; }
  .box { flex:1; height:150px; background:
        linear-gradient(45deg,#1a1712 25%,transparent 25%,transparent 75%,#1a1712 75%) 0 0/20px 20px,
        linear-gradient(45deg,#1a1712 25%,transparent 25%,transparent 75%,#1a1712 75%) 10px 10px/20px 20px,
        #242019; border:1px solid #3a332a; border-radius:8px; overflow:hidden;
        display:flex; align-items:flex-end; justify-content:center; }
  .box img { max-width:100%; max-height:100%; object-fit:contain; }
</style>
</head>
<body>
<h1>15 房间「时代升级态」— 现役 vs API 新图</h1>
<p class="note">每格左 = 现役胶囊（lit），右 = agnes 批量生成的升级态（generated5/cap_*_upg）。
新图已在烘焙管线中生效（Lv2/Lv3 显示），白底自动抠掉。看不满意的房间告诉我 id，单张重生成即可。</p>
<div class="grid" id="grid"></div>
<script>
const rooms = [
  ["entry_hall","入口大厅"],["dormitory","宿舍"],["mess_hall","食堂"],["medical","医疗室"],
  ["war_room","兵棋室"],["workshop","维修工坊"],["archive","档案室"],["comms","通讯室"],
  ["depot","仓库"],["honor_hall","荣誉陈列室"],["reactor","反应堆核心"],["phase_lab","相位实验室"],
  ["weather_station","气象站"],["observatory","观星台"],["monument","纪念碑墙"]
];
const grid = document.getElementById("grid");
for (const [id, zh] of rooms) {
  const fig = document.createElement("figure");
  fig.innerHTML =
    `<figcaption>${zh}（${id}）</figcaption>
     <div class="pair">
       <div class="box"><img src="../../assets/bunker/v3/cap_${id}.png" loading="lazy"></div>
       <div class="box"><img src="cap_${id}_upg.jpeg" loading="lazy"></div>
     </div>`;
  grid.appendChild(fig);
}
</script>
</body>
</html>
