<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Phase War - 大地图关卡选择面板 设计原型 v2</title>
<style>
:root {
  --bg-primary: #060a14;
  --bg-panel: rgba(10, 18, 35, 0.95);
  --bg-card: rgba(15, 25, 50, 0.85);
  --bg-card-hover: rgba(25, 45, 80, 0.9);
  --border-color: rgba(0, 180, 220, 0.25);
  --accent-cyan: #00d4ff;
  --accent-gold: #ffd700;
  --text-secondary: #8899bb;
  --text-muted: #556688;
  --era-ww1: #d4a420;
  --era-ww2: #44cc66;
  --era-cold: #4488ff;
  --era-modern: #00ddcc;
  --era-future: #aa55ff;
  --radius: 6px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
  background: var(--bg-primary);
  color: #e8f0ff;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
canvas#starfield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.scanlines {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 999; pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
}

/* ===== TOP BAR ===== */
.topbar {
  position: relative; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px;
  background: rgba(0,0,0,0.5);
  border-bottom: 1px solid rgba(0,180,220,0.2);
  flex-shrink: 0;
}
.topbar-title {
  font-size: 16px; font-weight: 700; letter-spacing: 2px;
  color: var(--accent-cyan);
  text-shadow: 0 0 10px rgba(0,212,255,0.3);
}
.topbar-stats {
  display: flex; gap: 18px; font-size: 11px; color: var(--text-secondary);
}
.topbar-stats .val { color: var(--accent-gold); font-weight: 600; }

/* ===== ERA TABS ===== */
.era-tabs {
  position: relative; z-index: 10;
  display: flex; gap: 2px;
  padding: 0 20px;
  background: rgba(0,0,0,0.3);
  border-bottom: 1px solid rgba(0,180,220,0.1);
  flex-shrink: 0;
}
.era-tab {
  padding: 8px 18px;
  font-size: 12px; font-weight: 600;
  cursor: pointer;
  border: none; border-radius: var(--radius) var(--radius) 0 0;
  background: rgba(15,25,50,0.5);
  color: var(--text-secondary);
  transition: all 0.2s;
  display: flex; align-items: center; gap: 6px;
  position: relative;
}
.era-tab:hover { background: rgba(25,45,80,0.6); color: #e8f0ff; }
.era-tab.active {
  background: var(--bg-panel);
  color: var(--accent-cyan);
  border-bottom-color: var(--bg-panel);
}
.era-tab .era-dot {
  width: 6px; height: 6px; border-radius: 50%;
}
.era-tab .era-count {
  font-size: 10px; opacity: 0.6;
}

/* ===== MAIN LAYOUT: LEFT GRID + RIGHT PANEL ===== */
.main-area {
  position: relative; z-index: 10;
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* LEFT: Level Grid */
.left-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding: 12px 16px;
}
.left-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
  flex-shrink: 0;
}
.left-title {
  font-size: 14px; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
}
.left-title .dot { width: 8px; height: 8px; border-radius: 50%; }
.quick-btn {
  padding: 5px 12px; border-radius: 4px;
  font-size: 11px; font-weight: 600; cursor: pointer;
  border: 1px solid rgba(0,180,220,0.3);
  background: rgba(0,180,220,0.1);
  color: var(--accent-cyan);
  transition: all 0.2s;
}
.quick-btn:hover { background: rgba(0,180,220,0.25); }

.level-grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  grid-template-rows: repeat(2, 1fr);
  gap: 6px;
  overflow-y: auto;
  padding-right: 4px;
}
.level-grid::-webkit-scrollbar { width: 4px; }
.level-grid::-webkit-scrollbar-track { background: transparent; }
.level-grid::-webkit-scrollbar-thumb { background: rgba(0,180,220,0.2); border-radius: 2px; }

/* Level Cell */
.lv-cell {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  border-radius: var(--radius);
  border: 1px solid rgba(255,255,255,0.06);
  background: var(--bg-card);
  cursor: pointer;
  transition: all 0.15s ease;
  position: relative;
  min-height: 64px;
}
.lv-cell:hover {
  border-color: var(--accent-cyan);
  background: var(--bg-card-hover);
  transform: scale(1.04);
  z-index: 5;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4), 0 0 8px rgba(0,212,255,0.1);
}
.lv-cell.selected {
  border-color: var(--accent-cyan);
  background: rgba(0,180,220,0.12);
  box-shadow: 0 0 12px rgba(0,212,255,0.2);
}
.lv-cell.locked {
  opacity: 0.3; cursor: default;
  border-color: rgba(255,255,255,0.02);
}
.lv-cell.locked:hover {
  transform: none; box-shadow: none;
  border-color: rgba(255,255,255,0.06);
  background: var(--bg-card);
}
.lv-cell.completed { border-left: 2px solid #44ff88; }
.lv-cell.current {
  border: 1px solid var(--accent-cyan);
  box-shadow: 0 0 10px rgba(0,212,255,0.15);
}
.lv-cell.boss { border-bottom: 2px solid #ffa500; }
.lv-cell.story { border-top: 2px solid #aa55ff; }
.lv-cell.occupied { border-right: 2px solid #ffa500; }

.cell-num {
  font-size: 18px; font-weight: 700;
  line-height: 1;
}
.cell-stars {
  font-size: 8px;
  letter-spacing: 1px;
  margin-top: 3px;
  color: var(--accent-gold);
}
.cell-badge {
  position: absolute;
  font-size: 8px; font-weight: 700;
  padding: 1px 3px; border-radius: 2px;
}
.cell-badge.boss-badge {
  top: 2px; right: 3px;
  background: #ffa500; color: #000;
}
.cell-badge.story-badge {
  top: 2px; left: 3px;
  color: #aa55ff;
}
.cell-badge.lock-badge {
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  font-size: 16px;
  background: transparent;
  color: var(--text-muted);
}
.cell-diff {
  font-size: 8px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* RIGHT: Detail Panel */
.right-panel {
  width: 300px;
  flex-shrink: 0;
  background: var(--bg-panel);
  border-left: 1px solid var(--border-color);
  display: flex; flex-direction: column;
  overflow: hidden;
  transition: all 0.3s;
}
.right-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-color);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.right-title { font-size: 14px; font-weight: 700; }
.right-close {
  width: 24px; height: 24px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.1);
  background: transparent; color: var(--text-secondary);
  cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
}
.right-close:hover { border-color: #ff4444; color: #ff4444; }
.right-body {
  padding: 14px 16px;
  flex: 1; overflow-y: auto;
}
.right-body::-webkit-scrollbar { width: 3px; }
.right-body::-webkit-scrollbar-thumb { background: rgba(0,180,220,0.2); border-radius: 2px; }

.detail-section { margin-bottom: 14px; }
.detail-section-title {
  font-size: 9px; text-transform: uppercase;
  color: var(--text-muted); letter-spacing: 1.5px;
  margin-bottom: 6px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  padding-bottom: 3px;
}
.detail-row {
  display: flex; justify-content: space-between;
  padding: 3px 0; font-size: 12px;
}
.detail-row .label { color: var(--text-secondary); }
.detail-row .value { color: #e8f0ff; font-weight: 500; }
.detail-desc {
  font-size: 11px; color: var(--text-secondary);
  line-height: 1.6;
}
.env-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
  margin-top: 4px;
}
.env-tag {
  padding: 4px 8px; border-radius: 3px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.05);
  font-size: 10px; color: var(--text-secondary);
}
.env-tag .tl { color: var(--text-muted); }
.action-row {
  display: flex; gap: 8px; margin-top: 12px;
  flex-shrink: 0;
}
.action-row .btn {
  flex: 1; text-align: center; padding: 8px;
  border-radius: 4px; font-size: 12px; font-weight: 600;
  cursor: pointer; border: 1px solid;
  transition: all 0.2s;
}
.btn-enter {
  background: rgba(0,212,255,0.12);
  border-color: var(--accent-cyan);
  color: var(--accent-cyan);
}
.btn-enter:hover { background: rgba(0,212,255,0.25); }
.btn-auto {
  background: rgba(68,255,136,0.08);
  border-color: rgba(68,255,136,0.4);
  color: #44ff88;
}
.btn-auto:hover { background: rgba(68,255,136,0.18); }

.empty-state {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  height: 100%; color: var(--text-muted);
  font-size: 12px; gap: 8px;
}
.empty-state .icon { font-size: 32px; opacity: 0.3; }

/* Bottom bar */
.bottom-bar {
  position: relative; z-index: 10;
  display: flex; align-items: center; gap: 16px;
  padding: 5px 20px;
  background: rgba(0,0,0,0.4);
  border-top: 1px solid rgba(0,180,220,0.1);
  font-size: 10px; color: var(--text-muted);
  flex-shrink: 0;
}
.legend-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>

<div class="scanlines"></div>
<canvas id="starfield"></canvas>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-title">WAR MAP</div>
  <div class="topbar-stats">
    <span>总进度 <span class="val">47/100</span></span>
    <span>总星数 <span class="val">98/300</span></span>
    <span>侦察加成 <span class="val" style="color:#44ff88">+12%</span></span>
  </div>
</div>

<!-- ERA TABS -->
<div class="era-tabs" id="eraTabs"></div>

<!-- MAIN: LEFT GRID + RIGHT PANEL -->
<div class="main-area">
  <!-- LEFT: Level Grid -->
  <div class="left-panel">
    <div class="left-header">
      <div class="left-title">
        <span class="dot" id="eraDot"></span>
        <span id="eraLabel">二战时代</span>
        <span style="font-size:11px;color:var(--text-muted)" id="eraRange">(21-40)</span>
      </div>
      <div style="display:flex;gap:6px;">
        <button class="quick-btn" onclick="enterNext()">&#x25B6; 下一关</button>
        <button class="quick-btn" style="border-color:rgba(255,165,0,0.4);color:#ffa500;background:rgba(255,165,0,0.1);" onclick="enterBoss()">&#x26A1; Boss</button>
      </div>
    </div>
    <div class="level-grid" id="levelGrid"></div>
  </div>

  <!-- RIGHT: Detail Panel -->
  <div class="right-panel" id="rightPanel">
    <div class="empty-state" id="emptyState">
      <div class="icon">&#x1F5FA;</div>
      <div>选择左侧关卡查看详情</div>
    </div>
    <div id="detailView" style="display:none;height:100%;display:none;flex-direction:column;">
      <div class="right-header">
        <div class="right-title" id="detailTitle">-</div>
        <button class="right-close" onclick="closeDetail()">&times;</button>
      </div>
      <div class="right-body">
        <div class="detail-section">
          <div class="detail-section-title">基本信息</div>
          <div class="detail-row"><span class="label">关卡编号</span><span class="value" id="dNum">-</span></div>
          <div class="detail-row"><span class="label">难度</span><span class="value" id="dDiff">-</span></div>
          <div class="detail-row"><span class="label">评价</span><span class="value" id="dStars">-</span></div>
          <div class="detail-row"><span class="label">推荐等级</span><span class="value" id="dRec">-</span></div>
          <div class="detail-row"><span class="label">驻防势力</span><span class="value" id="dFaction">-</span></div>
        </div>
        <div class="detail-section">
          <div class="detail-section-title">环境参数</div>
          <div class="env-grid" id="dEnv"></div>
        </div>
        <div class="detail-section">
          <div class="detail-section-title">敌情预览</div>
          <div class="detail-desc" id="dEnemy">-</div>
        </div>
        <div class="detail-section">
          <div class="detail-section-title">关卡描述</div>
          <div class="detail-desc" id="dDesc">-</div>
        </div>
      </div>
      <div class="action-row">
        <button class="btn btn-enter" onclick="enterSel()">&#x25B6; 进入该关</button>
        <button class="btn btn-auto" onclick="autoDeploy()">&#x2699; 自动部署</button>
      </div>
    </div>
  </div>
</div>

<!-- BOTTOM LEGEND -->
<div class="bottom-bar">
  <span><span class="legend-dot" style="background:#aa55ff"></span> 剧情任务</span>
  <span><span class="legend-dot" style="background:#ffa500"></span> 占领势力</span>
  <span><span class="legend-dot" style="background:#ffa500"></span> Boss 关</span>
  <span><span class="legend-dot" style="background:#44ff88"></span> 已通关</span>
  <span><span class="legend-dot" style="background:var(--accent-cyan)"></span> 当前关卡</span>
</div>

<script>
// ===== DATA =====
const ERAS = [
  { id:1, name:'一战', icon:'\u2694', range:'1-20', color:'#d4a420' },
  { id:2, name:'二战', icon:'\u2708', range:'21-40', color:'#44cc66' },
  { id:3, name:'冷战', icon:'\u2622', range:'41-60', color:'#4488ff' },
  { id:4, name:'现代', icon:'\U0001F680', range:'61-80', color:'#00ddcc' },
  { id:5, name:'未来', icon:'\u26A1', range:'81-100', color:'#aa55ff' },
];

function seededRand(seed) {
  let s = seed;
  return function() { s = (s*16807)%2147483647; return (s-1)/2147483646; };
}

const LV = {};
const SEEDS = [42,137,256,512,1024];
const TERRAINS = ['平原','山地','沙漠','雨林','雪地','废墟','城市','沼泽'];
const WEATHERS = ['晴','多云','暴雨','沙尘暴','暴风雪','浓雾','雷暴'];
const ENVS = ['稳定','紊乱','增强','衰减','脉冲'];
const TIMES = ['黎明','白天','黄昏','深夜'];
const FACTIONS = ['','铁壁 corp','','量子物流','','虚空研究','前沿联盟','',''];
const ENEMY_POOL = [
  '轻型步兵','装甲车','迫击炮组','狙击手','工程兵','防空车','火箭炮','侦察机',
  '主战坦克','直升机','无人机','电磁炮','机械步兵','隐形战机','轨道炮'
];

ERAS.forEach((era, ei) => {
  const rng = seededRand(SEEDS[ei]);
  for (let lv = (era.id-1)*20+1; lv <= era.id*20; lv++) {
    const pos = lv - (era.id-1)*20;
    const isBoss = (pos === 20);
    const isStory = (lv % 7 === 0) || (lv === 1);
    const completed = lv <= 47;
    const current = (lv === 48);
    const unlocked = lv <= 48;
    const stars = completed ? Math.floor(rng()*3)+1 : 0;
    const diffs = ['简单','简单','简单','普通','普通','普通','困难','困难','困难','极难'];
    const diff = diffs[Math.min(Math.floor((pos-1)/5), 3)];
    const faction = FACTIONS[Math.floor(rng()*FACTIONS.length)];
    const nEnemies = 3 + Math.floor(rng()*4);
    const enemies = [];
    for (let i = 0; i < nEnemies; i++) enemies.push(ENEMY_POOL[Math.floor(rng()*ENEMY_POOL.length)]);

    LV[lv] = {
      era: era.id, eraName: era.name, eraColor: era.color,
      num: lv, pos, isBoss, isStory, completed, current, unlocked, stars,
      difficulty: diff,
      terrain: TERRAINS[Math.floor(rng()*TERRAINS.length)],
      weather: WEATHERS[Math.floor(rng()*WEATHERS.length)],
      energyField: ENVS[Math.floor(rng()*ENVS.length)],
      timeOfDay: TIMES[Math.floor(rng()*TIMES.length)],
      faction,
      recLevel: Math.max(1, lv - 5 + Math.floor(rng()*10)),
      enemies: [...new Set(enemies)].slice(0, 5),
    };
  }
});

let activeEra = 2;
let selLevel = null;

// ===== ERA TABS =====
function renderTabs() {
  const c = document.getElementById('eraTabs');
  c.innerHTML = '';
  ERAS.forEach(era => {
    const start = (era.id-1)*20+1, end = era.id*20;
    let done = 0;
    for (let lv = start; lv <= end; lv++) if (LV[lv].completed) done++;
    const tab = document.createElement('button');
    tab.className = 'era-tab' + (era.id === activeEra ? ' active' : '');
    tab.innerHTML = `<span class="era-dot" style="background:${era.color}"></span>${era.icon} ${era.name}<span class="era-count">${done}/20</span>`;
    tab.onclick = () => switchEra(era.id);
    c.appendChild(tab);
  });
}

// ===== LEVEL GRID =====
function renderGrid() {
  const era = ERAS.find(e => e.id === activeEra);
  const grid = document.getElementById('levelGrid');
  grid.innerHTML = '';
  grid.style.gridTemplateColumns = 'repeat(10, 1fr)';
  grid.style.gridTemplateRows = 'repeat(2, 1fr)';

  document.getElementById('eraLabel').textContent = era.name + '时代';
  document.getElementById('eraRange').textContent = '(' + era.range + ')';
  document.getElementById('eraDot').style.background = era.color;

  for (let lv = (era.id-1)*20+1; lv <= era.id*20; lv++) {
    const d = LV[lv];
    const cell = document.createElement('div');
    let cls = 'lv-cell';
    if (!d.unlocked) cls += ' locked';
    if (d.completed) cls += ' completed';
    if (d.current) cls += ' current';
    if (d.isBoss) cls += ' boss';
    if (d.isStory) cls += ' story';
    if (d.faction) cls += ' occupied';
    cell.className = cls;
    cell.dataset.lv = lv;

    if (!d.unlocked) {
      cell.innerHTML = `<span class="cell-badge lock-badge">\u{1F512}</span>`;
    } else {
      let badges = '';
      if (d.isBoss) badges += '<span class="cell-badge boss-badge">BOSS</span>';
      if (d.isStory) badges += '<span class="cell-badge story-badge">\u2605</span>';
      cell.innerHTML = badges +
        `<span class="cell-num">${d.pos}</span>` +
        `<span class="cell-stars">${'&#x2B50;'.repeat(d.stars)}${'&#x2606;'.repeat(3-d.stars)}</span>` +
        `<span class="cell-diff">${d.difficulty}</span>`;
    }

    cell.onclick = () => selectCell(lv);
    grid.appendChild(cell);
  }
}

// ===== SELECT CELL =====
function selectCell(lv) {
  const d = LV[lv];
  if (!d || !d.unlocked) return;
  selLevel = lv;

  // Highlight
  document.querySelectorAll('.lv-cell').forEach(c => c.classList.remove('selected'));
  const cell = document.querySelector(`.lv-cell[data-lv="${lv}"]`);
  if (cell) cell.classList.add('selected');

  // Show detail
  document.getElementById('emptyState').style.display = 'none';
  const dv = document.getElementById('detailView');
  dv.style.display = 'flex';

  document.getElementById('detailTitle').textContent = `${d.eraName} · 第${d.pos}关`;
  document.getElementById('detailTitle').style.color = d.eraColor;
  document.getElementById('dNum').textContent = `第 ${lv} 关`;
  document.getElementById('dDiff').textContent = d.difficulty + (d.isBoss ? ' [BOSS]' : '');
  document.getElementById('dStars').innerHTML = d.stars > 0 ? '&#x2B50;'.repeat(d.stars)+'&#x2606;'.repeat(3-d.stars) : '<span style="color:var(--text-muted)">未通关</span>';
  document.getElementById('dRec').textContent = d.recLevel;
  document.getElementById('dFaction').textContent = d.faction || '无主之地';
  document.getElementById('dFaction').style.color = d.faction ? '#ffa500' : 'var(--text-muted)';

  document.getElementById('dEnv').innerHTML =
    `<div class="env-tag"><span class="tl">天气:</span> ${d.weather}</div>` +
    `<div class="env-tag"><span class="tl">地形:</span> ${d.terrain}</div>` +
    `<div class="env-tag"><span class="tl">能量场:</span> ${d.energyField}</div>` +
    `<div class="env-tag"><span class="tl">时段:</span> ${d.timeOfDay}</div>`;

  document.getElementById('dEnemy').innerHTML =
    '敌方单位：' + d.enemies.join('、') + '<br>' +
    '可能掉落：纳米材料、能量块、合金' + (d.completed ? ' <span style="color:#44ff88">&#x2713;</span>' : '');

  document.getElementById('dDesc').textContent =
    d.isBoss ? `该时代最终Boss关！建议等级 ${d.recLevel} 以上。环境条件恶劣，敌方增援频繁。` :
    d.isStory ? `剧情任务关卡。完成此关将推进主线剧情，解锁新势力关系。` :
    `标准作战关卡。${d.weather}条件下进行${d.terrain}地形作战。${d.faction ? '该区域已被 '+d.faction+' 占领。' : ''}`;
}

function closeDetail() {
  selLevel = null;
  document.querySelectorAll('.lv-cell').forEach(c => c.classList.remove('selected'));
  document.getElementById('emptyState').style.display = 'flex';
  document.getElementById('detailView').style.display = 'none';
}

function switchEra(id) {
  activeEra = id;
  selLevel = null;
  renderTabs();
  renderGrid();
  closeDetail();
}

function enterNext() {
  for (let lv = 1; lv <= 100; lv++) {
    if (LV[lv] && LV[lv].current) {
      alert('当前在第 ' + lv + ' 关，准备进入下一关');
      return;
    }
  }
}
function enterBoss() {
  const era = ERAS.find(e => e.id === activeEra);
  selectCell(era.id * 20);
}
function enterSel() {
  if (selLevel) alert('进入第 ' + selLevel + ' 关');
}
function autoDeploy() {
  if (selLevel) alert('自动部署至第 ' + selLevel + ' 关');
}

// ===== STARFIELD =====
(function(){
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let stars = [];
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    stars = [];
    for (let i = 0; i < 80; i++) {
      stars.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*1+0.3, a: Math.random()*0.3+0.1 });
    }
  }
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    stars.forEach(s => {
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(180,210,255,${s.a})`; ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize(); draw();
})();

// ===== INIT =====
renderTabs();
renderGrid();
</script>
