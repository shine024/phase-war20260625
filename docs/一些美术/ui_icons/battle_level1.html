<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Phase War — 第1关 战斗界面</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; font-family: 'Rajdhani', 'Noto Sans SC', sans-serif;
    overflow: hidden;
  }
  #game-screen {
    width: 1280px; height: 720px; position: relative;
    background: linear-gradient(180deg, #0a0e18 0%, #1a2535 40%, #2a3a4a 70%, #3a4a5a 100%);
    overflow: hidden;
  }

  /* === 背景装饰 === */
  .bg-mountains {
    position: absolute; bottom: 80px; left: 0; right: 0; height: 300px;
    background:
      linear-gradient(135deg, transparent 33%, #1a2535 33%, #1a2535 66%, transparent 66%),
      linear-gradient(225deg, transparent 33%, #15202f 33%, #15202f 66%, transparent 66%);
    opacity: 0.3;
  }
  .bg-ground {
    position: absolute; bottom: 0; left: 0; right: 0; height: 80px;
    background: linear-gradient(0deg, #1a2535 0%, #2a3a4a 100%);
  }
  .bg-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(68,136,170,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(68,136,170,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* === 顶部栏 === */
  .top-bar {
    position: absolute; top: 0; left: 0; right: 0; height: 48px;
    background: rgba(10,14,24,0.85); border-bottom: 1px solid rgba(68,136,170,0.3);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; z-index: 10;
  }
  .level-badge {
    background: linear-gradient(135deg, #1a3a5a, #0a2a4a);
    border: 1px solid rgba(68,136,170,0.5); border-radius: 6px;
    padding: 4px 12px; font-size: 14px; color: #8ab4cc; font-weight: 600;
  }
  .wave-info {
    display: flex; align-items: center; gap: 12px; font-size: 14px; color: #8ab4cc;
  }
  .timer {
    background: rgba(68,136,170,0.15); border: 1px solid rgba(68,136,170,0.3);
    border-radius: 4px; padding: 2px 8px; font-size: 13px; color: #00ccff;
  }
  .resources {
    display: flex; align-items: center; gap: 16px; font-size: 13px; color: #8ab4cc;
  }
  .resource-item {
    display: flex; align-items: center; gap: 4px;
  }
  .resource-item svg { width: 16px; height: 16px; }

  /* === 左侧面板 === */
  .left-panel {
    position: absolute; top: 56px; left: 8px; width: 200px;
    background: rgba(10,14,24,0.85); border: 1px solid rgba(68,136,170,0.3);
    border-radius: 8px; padding: 12px; z-index: 5;
  }
  .unit-avatar {
    width: 80px; height: 80px; margin: 0 auto 8px;
    background: linear-gradient(135deg, #1a3a5a, #0a2a4a);
    border: 2px solid rgba(68,136,170,0.5); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .unit-avatar svg { width: 48px; height: 48px; }
  .unit-name {
    text-align: center; font-size: 14px; color: #8ab4cc; font-weight: 600;
    margin-bottom: 8px;
  }
  .stat-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
  }
  .stat-label { font-size: 11px; color: #5a8aaa; width: 24px; }
  .stat-bar-bg {
    flex: 1; height: 12px; background: rgba(20,30,50,0.8);
    border-radius: 3px; overflow: hidden;
  }
  .stat-bar-fill {
    height: 100%; border-radius: 3px;
  }
  .hp-fill { background: linear-gradient(90deg, #00aa66, #00cc88); width: 75%; }
  .atk-fill { background: linear-gradient(90deg, #cc4444, #ff6666); width: 60%; }
  .stat-val { font-size: 10px; color: #8ab4cc; width: 36px; text-align: right; }

  .mod-section {
    margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(68,136,170,0.2);
  }
  .mod-title { font-size: 11px; color: #5a8aaa; margin-bottom: 6px; }
  .mod-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .mod-slot {
    width: 100%; aspect-ratio: 1; background: rgba(20,30,50,0.6);
    border: 1px solid rgba(68,136,170,0.2); border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
  }
  .mod-slot svg { width: 20px; height: 20px; }
  .mod-slot.filled { border-color: rgba(0,180,220,0.4); background: rgba(0,60,100,0.3); }

  /* === 手牌区 === */
  .hand-area {
    position: absolute; top: 56px; right: 8px; width: 280px;
    display: flex; gap: 8px; z-index: 5;
  }
  .card {
    width: 120px; height: 160px;
    background: linear-gradient(135deg, #1a2a3a, #0a1a2a);
    border: 1px solid rgba(68,136,170,0.4); border-radius: 8px;
    display: flex; flex-direction: column; align-items: center;
    padding: 8px; position: relative;
  }
  .card.selected {
    border-color: #00ccff; box-shadow: 0 0 12px rgba(0,200,255,0.3);
    transform: translateY(-12px);
  }
  .card-icon { width: 48px; height: 48px; margin: 8px 0; }
  .card-icon svg { width: 100%; height: 100%; }
  .card-name { font-size: 12px; color: #8ab4cc; margin-bottom: 4px; }
  .card-stats { font-size: 10px; color: #5a8aaa; }
  .card-cost {
    position: absolute; top: 4px; right: 4px;
    width: 20px; height: 20px; border-radius: 50%;
    background: rgba(0,100,200,0.5); border: 1px solid rgba(0,180,220,0.6);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #00ccff; font-weight: 700;
  }
  .empty-slot {
    width: 120px; height: 160px;
    background: rgba(10,14,24,0.4);
    border: 1px dashed rgba(68,136,170,0.2); border-radius: 8px;
  }

  /* === 底部栏 === */
  .bottom-bar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 64px;
    background: rgba(10,14,24,0.9); border-top: 1px solid rgba(68,136,170,0.3);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px; z-index: 10;
  }
  .left-section { display: flex; gap: 4px; }
  .right-section { display: flex; gap: 4px; }

  .btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(15,25,45,0.9); border: 1px solid rgba(68,136,170,0.4);
    border-radius: 6px; min-width: 64px; min-height: 52px;
    cursor: pointer; transition: all 0.15s ease;
  }
  .btn:hover { background: rgba(20,40,70,0.95); border-color: rgba(0,180,220,0.7); }
  .btn svg { width: 24px; height: 24px; }
  .btn .label { font-size: 11px; color: #8ab4cc; margin-top: 2px; }

  .battle-btn {
    display: flex; align-items: center; justify-content: center;
    background: rgba(15,25,45,0.9); border: 1px solid rgba(68,136,170,0.4);
    border-radius: 6px; width: 36px; height: 36px;
    cursor: pointer; transition: all 0.15s ease;
  }
  .battle-btn:hover { background: rgba(20,40,70,0.95); border-color: rgba(0,180,220,0.7); }
  .battle-btn svg { width: 18px; height: 18px; }

  /* 选中高亮 */
  .btn.active {
    border-color: rgba(0,180,220,0.8);
    background: rgba(0,60,100,0.5);
    box-shadow: 0 0 8px rgba(0,180,220,0.3);
  }
  .btn.active .label { color: #00ccff; }
</style>
</head>
<body>
<div id="game-screen">
  <!-- 背景 -->
  <div class="bg-grid"></div>
  <div class="bg-mountains"></div>
  <div class="bg-ground"></div>

  <!-- 顶部栏 -->
  <div class="top-bar">
    <div class="level-badge">第1关</div>
    <div class="wave-info">
      <span>Wave 1/10</span>
      <span class="timer">03:24</span>
    </div>
    <div class="resources">
      <div class="resource-item">
        <!-- Lightning/Energy -->
        <svg viewBox="0 0 32 32"><path d="M18 4 L10 16 L16 16 L14 28 L22 16 L16 16 Z" fill="#ffcc00" stroke="#ff8800" stroke-width="1"/></svg>
        <span>120</span>
      </div>
      <div class="resource-item">
        <!-- Diamond -->
        <svg viewBox="0 0 32 32">
          <defs><linearGradient id="dia" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#44aaff"/><stop offset="100%" stop-color="#2266cc"/>
          </linearGradient></defs>
          <polygon points="16,4 26,14 16,28 6,14" fill="url(#dia)" stroke="#66ccff" stroke-width="1"/>
          <line x1="16" y1="4" x2="16" y2="28" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
          <line x1="6" y1="14" x2="26" y2="14" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
        </svg>
        <span>85</span>
      </div>
      <div class="resource-item">
        <!-- Nano -->
        <svg viewBox="0 0 32 32">
          <defs><linearGradient id="nano" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0066cc"/><stop offset="100%" stop-color="#004488"/>
          </linearGradient></defs>
          <circle cx="16" cy="16" r="10" fill="url(#nano)" stroke="#00aaff" stroke-width="1"/>
          <circle cx="16" cy="16" r="6" fill="none" stroke="#00ccff" stroke-width="0.5"/>
          <circle cx="16" cy="16" r="2" fill="#00eeff"/>
        </svg>
        <span>42</span>
      </div>
    </div>
  </div>

  <!-- 左侧面板 -->
  <div class="left-panel">
    <div class="unit-avatar">
      <!-- Shield unit icon -->
      <svg viewBox="0 0 32 32">
        <path d="M18 4 L10 16 L16 16 L14 28 L22 16 L16 16 Z" fill="#ffcc00" stroke="#ff8800" stroke-width="1"/>
      </svg>
    </div>
    <div class="unit-name">巡航Ⅰ型</div>
    <div class="stat-row">
      <span class="stat-label">HP</span>
      <div class="stat-bar-bg"><div class="stat-bar-fill hp-fill"></div></div>
      <span class="stat-val">750/1000</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">ATK</span>
      <div class="stat-bar-bg"><div class="stat-bar-fill atk-fill"></div></div>
      <span class="stat-val">120</span>
    </div>
    <div class="mod-section">
      <div class="mod-title">MOD 槽位</div>
      <div class="mod-grid">
        <div class="mod-slot filled">
          <svg viewBox="0 0 32 32"><path d="M16 4 L10 16 L16 16 L14 28 L22 16 L16 16 Z" fill="#ffcc00" stroke="#ff8800" stroke-width="1"/></svg>
        </div>
        <div class="mod-slot filled">
          <svg viewBox="0 0 32 32"><path d="M8 26 L8 10 L16 6 L24 10 L24 26 L16 22 Z" fill="#1a2a3a" stroke="#4488aa" stroke-width="1.5"/></svg>
        </div>
        <div class="mod-slot"></div>
        <div class="mod-slot"></div>
      </div>
    </div>
  </div>

  <!-- 手牌区 -->
  <div class="hand-area">
    <div class="card selected">
      <div class="card-cost">3</div>
      <div class="card-icon">
        <svg viewBox="0 0 32 32">
          <path d="M18 4 L10 16 L16 16 L14 28 L22 16 L16 16 Z" fill="#ffcc00" stroke="#ff8800" stroke-width="1"/>
        </svg>
      </div>
      <div class="card-name">FT-17 护盾</div>
      <div class="card-stats">HP 750 / ATK 120</div>
    </div>
    <div class="card">
      <div class="card-cost">2</div>
      <div class="card-icon">
        <svg viewBox="0 0 32 32"><path d="M18 4 L10 16 L16 16 L14 28 L22 16 L16 16 Z" fill="#ffcc00" stroke="#ff8800" stroke-width="1"/></svg>
      </div>
      <div class="card-name">能量爆发</div>
      <div class="card-stats">+50 能量</div>
    </div>
    <div class="empty-slot"></div>
    <div class="empty-slot"></div>
  </div>

  <!-- 底部栏 -->
  <div class="bottom-bar">
    <div class="left-section">
      <!-- 背包 -->
      <div class="btn">
        <svg viewBox="0 0 32 32"><rect x="6" y="10" width="20" height="16" rx="3" fill="#2a1a0a" stroke="#886644" stroke-width="1.5"/><rect x="10" y="14" width="12" height="8" rx="1" fill="#3a2a1a" stroke="#997755" stroke-width="0.5"/></svg>
        <span class="label">背包</span>
      </div>
      <!-- 相位仪 -->
      <div class="btn">
        <svg viewBox="0 0 32 32">
          <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0055aacc"/><stop offset="100%" stop-color="#003377cc"/>
          </linearGradient></defs>
          <circle cx="16" cy="16" r="10" fill="url(#bg)" stroke="#00aaff" stroke-width="1"/>
          <circle cx="16" cy="16" r="6" fill="none" stroke="#00ccff" stroke-width="0.5"/>
          <circle cx="16" cy="16" r="2" fill="#00eeff"/>
        </svg>
        <span class="label">相位仪</span>
      </div>
      <!-- 势力 -->
      <div class="btn">
        <svg viewBox="0 0 32 32">
          <circle cx="12" cy="10" r="3" fill="#0088cc" stroke="#00bbff" stroke-width="1"/>
          <circle cx="20" cy="10" r="3" fill="#0088cc" stroke="#00bbff" stroke-width="1"/>
          <path d="M8 26 L8 18 L16 14 L24 18 L24 26 Z" fill="#0066aa" stroke="#00aadd" stroke-width="1"/>
        </svg>
        <span class="label">势力</span>
      </div>
      <!-- 任务 -->
      <div class="btn">
        <svg viewBox="0 0 32 32">
          <rect x="6" y="4" width="20" height="24" rx="2" fill="#1a2a3a" stroke="#4488aa" stroke-width="1.5"/>
          <line x1="10" y1="10" x2="22" y2="10" stroke="#4488aa" stroke-width="1"/>
          <line x1="10" y1="14" x2="22" y2="14" stroke="#4488aa" stroke-width="1"/>
          <line x1="10" y1="18" x2="18" y2="18" stroke="#4488aa" stroke-width="1"/>
        </svg>
        <span class="label">任务</span>
      </div>
      <!-- 商店 -->
      <div class="btn">
        <svg viewBox="0 0 32 32">
          <path d="M8 24 L12 10 L16 16 L20 8 L24 24 Z" fill="none" stroke="#4488aa" stroke-width="2" stroke-linejoin="round"/>
          <line x1="10" y1="20" x2="22" y2="20" stroke="#4488aa" stroke-width="1.5"/>
        </svg>
        <span class="label">商店</span>
      </div>
      <!-- 排行 -->
      <div class="btn">
        <svg viewBox="0 0 32 32">
          <path d="M16 4 L20 12 L28 14 L22 20 L24 28 L16 24 L8 28 L10 20 L4 14 L12 12 Z" fill="#1a2a3a" stroke="#4488aa" stroke-width="1.5"/>
        </svg>
        <span class="label">排行</span>
      </div>
      <!-- 情报 -->
      <div class="btn">
        <svg viewBox="0 0 32 32">
          <path d="M16 4 L16 28 M12 10 L16 6 L20 10 M12 22 L16 26 L20 22" stroke="#ffaa44" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="label">情报</span>
      </div>
      <!-- 地图 -->
      <div class="btn">
        <svg viewBox="0 0 32 32">
          <path d="M6 26 L10 10 L16 16 L22 10 L26 26 Z" fill="#1a2a3a" stroke="#4488aa" stroke-width="1.5"/>
          <line x1="10" y1="10" x2="22" y2="16" stroke="#4488aa" stroke-width="0.5"/>
          <line x1="16" y1="16" x2="26" y2="26" stroke="#4488aa" stroke-width="0.5"/>
        </svg>
        <span class="label">地图</span>
      </div>
      <!-- 设置 -->
      <div class="btn">
        <svg viewBox="0 0 32 32">
          <circle cx="16" cy="16" r="6" fill="none" stroke="#4488aa" stroke-width="2"/>
          <circle cx="16" cy="16" r="2.5" fill="#4488aa"/>
          <line x1="16" y1="6" x2="16" y2="10" stroke="#4488aa" stroke-width="2" stroke-linecap="round"/>
          <line x1="16" y1="22" x2="16" y2="26" stroke="#4488aa" stroke-width="2" stroke-linecap="round"/>
          <line x1="6" y1="16" x2="10" y2="16" stroke="#4488aa" stroke-width="2" stroke-linecap="round"/>
          <line x1="22" y1="16" x2="26" y2="16" stroke="#4488aa" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="label">设置</span>
      </div>
      <!-- 存档 -->
      <div class="btn">
        <svg viewBox="0 0 32 32">
          <rect x="6" y="6" width="20" height="22" rx="2" fill="#1a2a3a" stroke="#4488aa" stroke-width="1.5"/>
          <rect x="10" y="10" width="12" height="3" rx="1" fill="#4488aa" opacity="0.5"/>
          <line x1="10" y1="17" x2="22" y2="17" stroke="#4488aa" stroke-width="1"/>
          <line x1="10" y1="21" x2="18" y2="21" stroke="#4488aa" stroke-width="1"/>
        </svg>
        <span class="label">存档</span>
      </div>
      <!-- 挂机 -->
      <div class="btn">
        <svg viewBox="0 0 32 32">
          <circle cx="16" cy="14" r="6" fill="none" stroke="#4488aa" stroke-width="1.5"/>
          <path d="M10 22 C10 18 13 16 16 16 C19 16 22 18 22 22" fill="none" stroke="#4488aa" stroke-width="1.5"/>
          <path d="M13 12 Q14 10 15 12" stroke="#00ccff" stroke-width="1" fill="none"/>
          <path d="M17 11 Q18 9 19 11" stroke="#00ccff" stroke-width="1" fill="none"/>
        </svg>
        <span class="label">挂机</span>
      </div>
    </div>

    <div class="right-section">
      <!-- 播放 -->
      <div class="battle-btn">
        <svg viewBox="0 0 32 32"><polygon points="10,6 26,16 10,26" fill="#00cc66" stroke="#00ff88" stroke-width="1"/></svg>
      </div>
      <!-- 暂停 -->
      <div class="battle-btn">
        <svg viewBox="0 0 32 32">
          <rect x="9" y="7" width="5" height="18" rx="1" fill="#ff8844" stroke="#ffaa66" stroke-width="0.5"/>
          <rect x="18" y="7" width="5" height="18" rx="1" fill="#ff8844" stroke="#ffaa66" stroke-width="0.5"/>
        </svg>
      </div>
      <!-- 投降 -->
      <div class="battle-btn">
        <svg viewBox="0 0 32 32"><path d="M20 4 L20 28 L12 20 L20 4Z" fill="#ff4444" stroke="#ff6666" stroke-width="1"/></svg>
      </div>
      <!-- 快进 -->
      <div class="battle-btn">
        <svg viewBox="0 0 32 32">
          <path d="M16 6 L16 26 M12 10 L16 6 L20 10 M12 22 L16 26 L20 22" stroke="#ffaa44" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <!-- 快退 -->
      <div class="battle-btn">
        <svg viewBox="0 0 32 32">
          <path d="M12 6 L12 26 M16 10 L12 6 L8 10 M16 22 L12 26 L8 22" stroke="#ffaa44" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
  </div>
</div>
</body>
</html>
