.btn { padding:4px 10px; border:1px solid #2a2f3a; border-radius:5px; background:#161b26; color:#e2e8f0; cursor:pointer; font-size:11px; }

.card { background:#161b26; border:1px solid #2a2f3a; border-radius:7px; overflow:hidden; }
.card-header { display:flex; align-items:center; gap:8px; padding:6px 8px; border-bottom:1px solid #2a2f3a; }
.card-icon { width:48px; height:48px; object-fit:cover; border-radius:3px; background:#1e2430; border:1px solid #333; }
.card-info { flex:1; min-width:0; }
.card-name { font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card-id { font-size:8px; color:#8892a4; font-family:monospace; }
.card-body { display:flex; gap:8px; padding:6px 8px; }
.canvas-wrap { position:relative; flex-shrink:0; }
.canvas-wrap canvas { display:block; border-radius:3px; cursor:crosshair; background:#0d1117; touch-action:none; }
.stats { flex:1; min-width:0; font-size:9px; }
.stat-row { display:flex; justify-content:space-between; padding:1px 0; border-bottom:1px solid rgba(255,255,255,0.04); }
.stat-label { color:#8892a4; }
.stat-value { font-weight:600; }
.wt-badge { display:inline-block; padding:0 3px; border-radius:2px; font-size:8px; font-weight:700; color:#000; }
.edit-row { display:flex; align-items:center; gap:3px; padding:1px 0; }
.edit-row label { color:#8892a4; font-size:9px; min-width:50px; }
.edit-row input { width:46px; background:#0d1117; border:1px solid #2a2f3a; color:#e2e8f0; border-radius:2px; padding:1px 3px; font-size:9px; }
.edit-row input:focus { outline:none; border-color:#58a6ff; }
.card-footer { padding:3px 8px; border-top:1px solid #2a2f3a; font-size:8px; color:#8892a4; }
.formula { text-align:center; color:#8892a4; font-size:10px; padding:5px 14px; border-bottom:1px solid #2a2f3a; line-height:1.6; }
.toast { position:fixed; top:14px; right:14px; padding:6px 12px; border-radius:4px; font-size:11px; z-index:999; opacity:0; transition:opacity .3s; pointer-events:none; background:#3fb950; color:#000; }

070.png", "vis": "vis_enemy_070"}, {"id": "fut_arm_titan_mk2", "name": "泰坦Mk.II", "era": "近未来", "tier": "CHAMPION", "hp": 1600, "rng": 5, "ff": 0.15, "hf": 0.15, "fireX": 0.5, "fireY_pct": 50.0, "icon": "vis_enemy_031.png", "vis": "vis_enemy_031"}, {"id": "drop_mega_particle_cannon", "name": "巨型粒子炮", "era": "近未来", "tier": "CHAMPION", "hp": 1400, "rng": 6, "ff": 0.15, "hf": 0.15, "fireX": 0.1033, "fireY_pct": 44.0, "icon": "vis_enemy_070.png", "vis": "vis_enemy_070"}, {"id": "fut_boss_nexus", "name": "风暴核心·Boss", "era": "近未来", "tier": "BOSS", "hp": 2500, "rng": 5, "ff": 0.15, "hf": 0.15, "fireX": 0.3533, "fireY_pct": 38.8, "icon": "vis_enemy_071.png", "vis": "vis_enemy_071"}, {"id": "platform_future_radar", "name": "近未来雷达平台", "era": "近未来", "tier": "GRUNT", "hp": 300, "rng": 3, "ff": 0.15, "hf": 0.15, "fireX": 0.5, "fireY_pct": 50.0, "icon": "vis_enemy_087.png", "vis": "vis_enemy_087"}, {"id": "fut_sup_nrepair", "name": "N-Repair 纳米工程车", "era": "近未来", "tier": "VETERAN", "hp": 500, "rng": 3, "ff": 0.15, "hf": 0.15, "fireX": 0.5, "fireY_pct": 50.0, "icon": "fut_sup_nrepair.png", "vis": "fut_sup_nrepair"}, {"id": "fut_sup_ps9", "name": "PS-9 相位中继站", "era": "近未来", "tier": "VETERAN", "hp": 480, "rng": 3, "ff": 0.15, "hf": 0.15, "fireX": 0.5, "fireY_pct": 50.0, "icon": "fut_sup_ps9.png", "vis": "fut_sup_ps9"}, {"id": "fut_sup_bulwark", "name": "壁垒", "era": "近未来", "tier": "ELITE", "hp": 900, "rng": 3, "ff": 0.15, "hf": 0.15, "fireX": 0.5, "fireY_pct": 50.0, "icon": "vis_enemy_030.png", "vis": "vis_enemy_030"}, {"id": "fut_arty_hel30", "name": "HEL-30 激光炮阵列", "era": "近未来", "tier": "ELITE", "hp": 700, "rng": 5, "ff": 0.15, "hf": 0.15, "fireX": 0.5, "fireY_pct": 50.0, "icon": "fut_arty_hel30.png", "vis": "fut_arty_hel30"}, {"id": "fut_arty_ssc1", "name": "SS-C-1 岸防导弹组", "era": "近未来", "tier": "ELITE", "hp": 750, "rng": 6, "ff": 0.15, "hf": 0.15, "fireX": 0.5, "fireY_pct": 50.0, "icon": "fut_arty_ssc1.png", "vis": "fut_arty_ssc1"}, {"id": "fut_air_drone", "name": "无人机群", "era": "近未来", "tier": "GRUNT", "hp": 240, "rng": 4, "ff": 0.15, "hf": 0.15, "fireX": 0.0656, "fireY_pct": 43.07, "icon": "vis_enemy_065.png", "vis": "vis_enemy_065"}, {"id": "fut_air_regen_frame", "name": "再生骨架", "era": "近未来", "tier": "VETERAN", "hp": 600, "rng": 3, "ff": 0.15, "hf": 0.15, "fireX": 0.5, "fireY_pct": 50.0, "icon": "vis_enemy_034.png", "vis": "vis_enemy_034"}, {"id": "fut_air_heavy_carrier", "name": "重装母舰", "era": "近未来", "tier": "ELITE", "hp": 1400, "rng": 4, "ff": 0.15, "hf": 0.15, "fireX": 0.5, "fireY_pct": 50.0, "icon": "vis_enemy_033.png", "vis": "vis_enemy_033"}];

let currentFilter = 'all';
let searchTerm = '';
let dragState = null;

// Canvas 坐标系
const CW=150, CH=190, TEX_W=60, TEX_H=150;
const TEX_X=(CW-TEX_W)/2, TEX_TOP=10, TEX_BOT=TEX_TOP+TEX_H;

function getPoints(e) {
  return {
    footY: TEX_BOT - e.ff * TEX_H,
    headY: TEX_TOP + e.hf * TEX_H,
    fireX: TEX_X + e.fireX * TEX_W,
    fireY: TEX_TOP + e.fireY_pct/100 * TEX_H,
    centerX: TEX_X + TEX_W/2
  };
}

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  let list = enemies;
  if (currentFilter !== 'all') list = list.filter(e => e.era === currentFilter);
  if (searchTerm) {
    const s = searchTerm.toLowerCase();
    list = list.filter(e => e.id.toLowerCase().includes(s) || e.name.toLowerCase().includes(s));
  }
  list.forEach(e => {
    const idx = enemies.indexOf(e);
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.idx = idx;
    const iconHtml = e.icon
      ? `<img class="card-icon" src="${ICON_BASE}${e.icon}" alt="${e.name}" onerror="this.style.display='none'">`
      : `<div class="card-icon" style="display:flex;align-items:center;justify-content:center;font-size:8px;color:#555">${e.id.slice(0,6)}</div>`;
    card.innerHTML = `
      <div class="card-header" style="border-top:2px solid ${ERA_COLOR[e.era]}">
        ${iconHtml}
        <div class="card-info">
          <div class="card-name">${e.name} <span style="font-size:8px;color:${ERA_COLOR[e.era]}">${e.era}·${e.tier}</span></div>
          <div class="card-id">${e.id}</div>
        </div>
      </div>
      <div class="card-body">
        <div class="canvas-wrap"><canvas id="cv${idx}" width="${CW}" height="${CH}"></canvas></div>
        <div class="stats">
          <div class="stat-row"><span class="stat-label">HP/射程</span><span class="stat-value">${e.hp} / ${e.rng}</span></div>
          <div class="stat-row"><span class="stat-label">弹道Y</span><span class="stat-value" style="color:#ff6b6b" id="fy${idx}">${e.fireY_pct.toFixed(1)}%</span></div>
          <div class="stat-row"><span class="stat-label">弹道X</span><span class="stat-value" style="color:#ff6b6b" id="fx${idx}">${(e.fireX*100).toFixed(0)}%</span></div>
          <div style="margin-top:3px">
            <div class="edit-row"><label style="color:#50c878">脚ff</label><input type="number" step="0.001" min="0" max="1" value="${e.ff.toFixed(3)}" data-idx="${idx}" data-f="ff"></div>
            <div class="edit-row"><label style="color:#50c878">头hf</label><input type="number" step="0.001" min="0" max="1" value="${e.hf.toFixed(3)}" data-idx="${idx}" data-f="hf"></div>
            <div class="edit-row"><label style="color:#ff4040">弹道Y%</label><input type="number" step="0.1" min="0" max="100" value="${e.fireY_pct.toFixed(1)}" data-idx="${idx}" data-f="fireY_pct"></div>
            <div class="edit-row"><label style="color:#ff4040">弹道X%</label><input type="number" step="1" min="0" max="100" value="${(e.fireX*100).toFixed(0)}" data-idx="${idx}" data-f="fireX"></div>
          </div>
        </div>
      </div>
      <div class="card-footer">绿=脚/头 红=弹道(独立) | ff/hf/弹道 三者互不影响</div>
    `;
    grid.appendChild(card);
    setTimeout(() => draw(idx), 0);
  });

  document.querySelectorAll('canvas').forEach(cv => {
    const idx = parseInt(cv.id.replace('cv',''));
    cv.addEventListener('mousedown', ev => startDrag(idx, ev, cv));
    cv.addEventListener('touchstart', ev => startDrag(idx, ev, cv), {passive:false});
  });
  document.onmousemove = onMove;
  document.onmouseup = endDrag;
  document.ontouchmove = onMove;
  document.ontouchend = endDrag;

  document.querySelectorAll('.edit-row input').forEach(inp => {
    inp.onchange = ev => {
      const idx = parseInt(ev.target.dataset.idx);
      const f = ev.target.dataset.f;
      const v = parseFloat(ev.target.value);
      if (isNaN(v)) return;
      const e = enemies[idx];
      if (f === 'fireY_pct') e.fireY_pct = Math.max(0, Math.min(100, v));
      else if (f === 'fireX') e.fireX = Math.max(0, Math.min(1, v/100));
      else { if (v<0||v>1) return; e[f] = v; }
      sync(idx); draw(idx);
      toast(e.name + ' 已更新');
    };
  });
}

function draw(idx) {
  const cv = document.getElementById('cv'+idx);
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const e = enemies[idx];
  ctx.clearRect(0,0,CW,CH);
  const {footY, headY, fireX, fireY, centerX} = getPoints(e);

  ctx.fillStyle = '#0d1117'; ctx.fillRect(0,0,CW,CH);

  // 卡图
  const card = document.querySelector(`.card[data-idx="${idx}"]`);
  const img = card ? card.querySelector('.card-icon') : null;
  if (img && img.naturalWidth > 0) {
    const s = Math.min(TEX_W/img.naturalWidth, TEX_H/img.naturalHeight);
    const dw=img.naturalWidth*s, dh=img.naturalHeight*s;
    ctx.drawImage(img, TEX_X+(TEX_W-dw)/2, TEX_TOP+(TEX_H-dh)/2, dw, dh);
  }

  // 纹理框
  ctx.strokeStyle='#333'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
  ctx.strokeRect(TEX_X, TEX_TOP, TEX_W, TEX_H); ctx.setLineDash([]);

  // 实体范围
  ctx.fillStyle='rgba(80,200,120,0.06)'; ctx.fillRect(TEX_X, headY, TEX_W, footY-headY);
  ctx.strokeStyle='#50c878'; ctx.lineWidth=1; ctx.strokeRect(TEX_X, headY, TEX_W, footY-headY);

  // 脚/头标注
  ctx.fillStyle='#50c878'; ctx.font='8px sans-serif';
  ctx.fillText('脚'+e.ff.toFixed(2), TEX_X+TEX_W+3, footY+3);
  ctx.fillText('头'+e.hf.toFixed(2), TEX_X+TEX_W+3, headY+3);

  // 弹道标注
  ctx.fillStyle='#ff6b6b'; ctx.font='bold 8px sans-serif';
  ctx.fillText('Y'+e.fireY_pct.toFixed(0), TEX_X+TEX_W+3, fireY-3);
  ctx.fillText('X'+(e.fireX*100).toFixed(0), TEX_X+TEX_W+3, fireY+7);

  // 三个点（小而清晰）
  // 绿-脚
  ctx.fillStyle='#50c878'; ctx.beginPath(); ctx.arc(centerX, footY, 4, 0, 6.28); ctx.fill();
  ctx.strokeStyle='#0d1117'; ctx.lineWidth=1; ctx.stroke();
  // 绿-头
  ctx.beginPath(); ctx.arc(centerX, headY, 4, 0, 6.28); ctx.fill(); ctx.stroke();
  // 红-弹道（白描边醒目）
  ctx.fillStyle='#ff4040'; ctx.beginPath(); ctx.arc(fireX, fireY, 5, 0, 6.28); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();

  // 时代色条
  ctx.fillStyle = ERA_COLOR[e.era]; ctx.fillRect(0,0,2,CH);
}

function getCoord(ev, cv) {
  const r = cv.getBoundingClientRect();
  const cx = ev.clientX !== undefined ? ev.clientX : (ev.touches && ev.touches[0] ? ev.touches[0].clientX : 0);
  const cy = ev.clientY !== undefined ? ev.clientY : (ev.touches && ev.touches[0] ? ev.touches[0].clientY : 0);
  return { x:(cx-r.left)/r.width*CW, y:(cy-r.top)/r.height*CH };
}

function startDrag(idx, ev, cv) {
  const {x, y} = getCoord(ev, cv);
  const e = enemies[idx];
  const {footY, headY, fireX, fireY, centerX} = getPoints(e);
  // 距离判断（取最近点）
  const dFoot = Math.hypot(x-centerX, y-footY);
  const dHead = Math.hypot(x-centerX, y-headY);
  const dFire = Math.hypot(x-fireX, y-fireY);
  let type = null, best = 14;
  if (dFire < best) { best = dFire; type = 'fire'; }
  if (dFoot < best) { best = dFoot; type = 'ff'; }
  if (dHead < best) { best = dHead; type = 'hf'; }
  if (type) { dragState = {idx, type, cv}; ev.preventDefault(); }
}

function onMove(ev) {
  if (!dragState) return;
  const cv = dragState.cv;
  const {x, y} = getCoord(ev, cv);
  const e = enemies[dragState.idx];
  if (dragState.type === 'ff') {
    const v = Math.max(0, Math.min(1, (TEX_BOT-y)/TEX_H));
    if (Math.abs(v-e.ff)>0.0005) { e.ff = v; sync(dragState.idx); draw(dragState.idx); }
  } else if (dragState.type === 'hf') {
    const v = Math.max(e.ff, Math.min(1, (y-TEX_TOP)/TEX_H));
    if (Math.abs(v-e.hf)>0.0005) { e.hf = v; sync(dragState.idx); draw(dragState.idx); }
  } else if (dragState.type === 'fire') {
    // 红点：独立改 fireX 和 fireY_pct，不碰 ff/hf
    const nx = Math.max(0, Math.min(1, (x-TEX_X)/TEX_W));
    const ny = Math.max(0, Math.min(100, (y-TEX_TOP)/TEX_H*100));
    if (Math.abs(nx-e.fireX)>0.003 || Math.abs(ny-e.fireY_pct)>0.1) {
      e.fireX = nx; e.fireY_pct = ny;
      sync(dragState.idx); draw(dragState.idx);
    }
  }
  if (ev.cancelable) ev.preventDefault();
}

function endDrag() {
  if (dragState) { toast(enemies[dragState.idx].name + ' 已调整'); dragState = null; }
}

function sync(idx) {
  const card = document.querySelector(`.card[data-idx="${idx}"]`);
  if (!card) return;
  const e = enemies[idx];
  card.querySelector('input[data-f="ff"]').value = e.ff.toFixed(3);
  card.querySelector('input[data-f="hf"]').value = e.hf.toFixed(3);
  card.querySelector('input[data-f="fireY_pct"]').value = e.fireY_pct.toFixed(1);
  card.querySelector('input[data-f="fireX"]').value = (e.fireX*100).toFixed(0);
  const fy = document.getElementById('fy'+idx); if (fy) fy.textContent = e.fireY_pct.toFixed(1)+'%';
  const fx = document.getElementById('fx'+idx); if (fx) fx.textContent = (e.fireX*100).toFixed(0)+'%';
}

function filter(f) {
  currentFilter = f;
  document.querySelectorAll('.toolbar .btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function onSearch() {
  searchTerm = document.getElementById('search').value;
  render();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1500);
}

function exportJSON() {
  const d = JSON.stringify(enemies.map(e => ({
    id:e.id, ff:e.ff, hf:e.hf, fireX:e.fireX, fireY_pct:e.fireY_pct
  })), null, 2);
  const blob = new Blob([d], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'enemy_fire_spawn.json'; a.click();
  toast('JSON 已导出');
}

function exportGD() {
  const NL = String.fromCharCode(10);
  const lines = ['# 弹道锚点 - 来源：enemy_fire_spawn.html','# fireX: 0~1 (0=纹理左, 0.5=中, 1=右)','# fireY_pct: 0~100 (占纹理顶部百分比)','const MUZZLE: Dictionary = {'];
  enemies.forEach(e => {
    lines.push(`  "${e.id}": {"fireX": ${e.fireX.toFixed(3)}, "fireY_pct": ${e.fireY_pct.toFixed(2)}},`);
  });
  lines.push('}');
  const blob = new Blob([lines.join(NL)], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'muzzle_anchors.gd'; a.click();
  toast('GDScript 已导出');
}

render();
</script>
