<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>相位师技能树 - 方案E5：螺旋星暴式（全新设计）</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:radial-gradient(circle at center,#0a0e17,#000);color:#d0e4f0;font-family:'Microsoft YaHei',sans-serif;overflow:hidden;height:100vh}.scheme-label{position:fixed;top:10px;left:10px;background:rgba(255,80,120,0.2);border:1px solid rgba(255,80,120,0.5);color:#ff5078;padding:5px 14px;border-radius:4px;font-size:12px;zinct:100;font-weight:bold}.starburst-root{display:flex;justify-content:center;align-items:center;height:100vh;perspective:1200px}.starburst-container{position:relative;width:90vmin;height:90vmin;animation:starburst-rotate 60s linear infinite;transform-style:preserve-3d}@keyframes starburst-rotate{from{transform:rotateY(0deg) rotateX(10deg);}to{transform:rotateY(360deg) rotateX(10deg);}}.spiral-arm{position:absolute;top:50%;left:50%;width:2px;height:50%;transform-origin:bottom center;opacity:0.3;animation:arm-glow 3s infinite}@keyframes arm-glow{0%,100%{opacity:0.3;}50%{opacity:0.6;box-shadow:0 0 20px #ff5078;}}.starburst-node{position:absolute;width:60px;height:60px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all 0.5s cubic-bezier(0.68,-0.55,0.265,1.55);transform-style:preserve-3d;zinct:5;filter:drop-shadow(0 0 10px currentColor)}.starburst-node.unlocked{opacity:1;transform:scale(1) translateZ(var(--z,0)) rotateZ(var(rotate,0deg))}.starburst-node.locked{opacity:0.15;filter:blur(2px) grayscale(0.7);transform:scale(0.5) translateZ(-100px)}.starburst-node.available{opacity:1;animation:starburst-shake 1s infinite alternate;transform:scale(1.3) translateZ(30px)}@keyframes starburst-shake{0%{transform:scale(1.3) translateZ(30px) rotate(-5deg);}100%{transform:scale(1.3) translateZ(30px) rotate(5deg);}}.starburst-core{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;background:radial-gradient(circle at 30% 30%,var(--star-glow),var(--star-color));border:2px solid rgba(255,255,255,0.4);position:relative;zinct:2;box-shadow:0 0 25px var(--star-color)}.starburst-tier{position:absolute;top:-18px;font-size:8px;background:rgba(10,14,23,0.9);padding:2px 6px;border-radius:10px;letter-spacing:1px;zinct:3}.starburst-label{position:absolute;bottom:-20px;font-size:9px;background:rgba(10,14,23,0.95);padding:2px 6px;border-radius:6px;opacity:0;transition:opacity 0.3s;white-space:nowrap;zinct:4}.starburst-node:hover .starburst-label{opacity:1}.starburst-cost{position:absolute;right:-14px;top:50%;transform:translateY(-50%);font-size:7px;background:#ff5078;color:#000;padding:1px 3px;border-radius:8px;font-weight:bold;zinct:4}.info-panel{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:rgba(10,14,23,0.95);border:1px solid #ff5078;border-radius:6px;padding:10px 20px;font-size:10px;color:#d0e4f0;zinct:50}.info-panel span{color:#ff5078;font-weight:bold}</style></head><body><div class="scheme-label">方案 E5：螺旋星暴式（全新设计 - 32节点螺旋爆发）</div><div class="starburst-root"><div class="starburst-container" id="starburstContainer"></div></div><div class="info-panel">能量星核:<span>12</span> 已激活:<span>7</span> 层级:<span id="layer-level">4</span></div><script>const container=document.getElementById("starburstContainer");const spiralData=[{name:"指挥觉醒",desc:"单位上限+1",cost:1,rot:"0deg",z:"0px",tier:"CORE",icon:"◆",color:"#ff5078"},{name:"智能核心",desc:"暴击率+5%",cost:1,rot:"45deg",z:"20px",tier:"MID",icon:"♟",color:"#50ff78"},{name:"火力觉醒",desc:"攻击+8%",cost:1,rot:"90deg",z:"20px",tier:"MID",icon:"⚔",color:"#ff7850"},{name:"概念突破",desc:"能量+20%",cost:1,rot:"135deg",z:"20px",tier:"MID",icon:"⚡",color:"#7850ff"},{name:"基础防御",desc:"生命+15%",cost:1,rot:"180deg",z:"20px",tier:"MID",icon:"■",color:"#78ff50"},{name:"光学瞄准",desc:"精度+15%",cost:1,rot:"225deg",z:"20px",tier:"MID",icon:"🎯",color:"#50ff78"},{name:"战术学习",desc:"经验+20%",cost:1,rot:"270deg",z:"20px",tier:"MID",icon:"📚",color:"#ff7850"},{name:"能量储备",desc:"开局满能量",cost:1,rot:"315deg",z:"20px",tier:"MID",icon:"⚡⚡",color:"#ffff50"},{name:"快速部署",desc:"速度+15%",cost:1,rot:"22deg",z:"80px",tier:"RING1",icon:"▶",color:"#ffaa50"},{name:"战术规避",desc:"闪避+8%",cost:1,rot:"67deg",z:"80px",tier:"RING1",icon:"↗",color:"#50aa78"},{name:"穿甲弹道",desc:"穿透+20%",cost:1,rot:"112deg",z:"80px",tier:"RING1",icon:"➤",color:"#ff5050"},{name:"形态进化",desc:"卡牌进化",cost:1,rot:"157deg",z:"80px",tier:"RING1",icon:"🔄",color:"#785078"},{name:"指挥协同",desc:"增益共享",cost:2,rot:"202deg",z:"80px",tier:"RING1",icon:"🤝",color:"#5078ff"},{name:"侦察视野",desc:"视野+30%",cost:1,rot:"247deg",z:"80px",tier:"RING1",icon:"👁️",color:"#50ffff"},{name:"智能规避",desc:"自动回避",cost:1,rot:"292deg",z:"80px",tier:"RING1",icon:"⏪",color:"#ff78aa"},{name:"能量脉冲",desc:"周期爆发",cost:2,rot:"337deg",z:"80px",tier:"RING1",icon:"⚡⚡⚡",color:"#ffaa50"},{name:"领域统帅",desc:"三维防+12%",cost:3,rot:"45deg",z:"140px",tier:"RING2",icon:"◆◆◆",color:"#ff5078"},{name:"纵深打击",desc:"射程+10%",cost:2,rot:"90deg",z:"140px",tier:"RING2",icon:"➢",color:"#50ff78"},{name:"智能火控",desc:"自动索敌",cost:2,rot:"135deg",z:"140px",tier:"RING2",icon:"🎯💡",color:"#ff7850"},{name:"核爆打击",desc:"全体轰炸",cost:3,rot:"180deg",z:"140px",tier:"RING2",icon:"☢️",color:"#7850ff"},{name:"战略机动",desc:"战术跳跃",cost:2,rot:"225deg",z:"140px",tier:"RING2",icon:"🏃",color:"#78ff50"},{name:"穿透强化",desc:"装甲+35%",cost:2,rot:"270deg",z:"140px",tier:"RING2",icon:"🔩",color:"#50ff78"},{name:"AI进化",desc:"存活提升",cost:3,rot:"315deg",z:"140px",tier:"RING2",icon:"🧬",color:"#ff7850"},{name:"终极护盾",desc:"全体无敌",cost:3,rot:"0deg",z:"140px",tier:"RING2",icon:"🛡️🛡️",color:"#ffff50"},{name:"指挥相位",desc:"战术核心",cost:2,rot:"22.5deg",z:"200px",tier:"RING3",icon:"◆⚙️",color:"#ff5078"},{name:"火力相位",desc:"超弦阵列",cost:2,rot:"67.5deg",z:"200px",tier:"RING3",icon:"⚔️⚡",color:"#50ff78"},{name:"智能相位",desc:"自主决策",cost:2,rot:"112.5deg",z:"200px",tier:"RING3",icon:"♟️🧠",color:"#ff7850"},{name:"概念相位",desc:"时空扭曲",cost:2,rot:"157.5deg",z:"200px",tier:"RING3",icon:"⚡⏳",color:"#7850ff"},{name:"时空扭曲",desc:"暂停战场",cost:5,rot:"180deg",z:"250px",tier:"ULT",icon:"⏸️",color:"#ff5078"},{name:"维度掌控",desc:"操控空间",cost:5,rot:"225deg",z:"250px",tier:"ULT",icon:"🌌",color:"#50ff78"}];spiralData.forEach(n=>{const el=document.createElement("div");el.className="starburst node "+(n.tier==="ULT"?"available":(n.tier==="CORE"?"unlocked":"locked"));const angle=n.rot.replace("deg","")*Math.PI/180;const r=n.z.replace("px","")*0.8+150;const x=Math.cos(angle)*r;const y=Math.sin(angle)*r;el.style.left="50%";el.style.top="50%";el.style.transform=`translate(${x}px, ${y}px) translateZ(${n.z}) rotateZ(${n.rot})`;el.style.setProperty("--star-color",n.color);el.style.setProperty("--star-glow",n.color);el.innerHTML=`<div class="starburst-tier">${n.tier}</div><div class="starburst-core"><span style="color:${n.color}">${n.icon}</span></div><div class="starburst-label">${n.name}</div><div class="starburst-cost">${n.cost}点</div>`;el.onclick=()=>alert("技能:\n"+n.name+"\n"+n.desc);container.appendChild(el);});</script></body></html>
