nimation:ring-wobble 0.8s infinite alternate; } @keyframes ring-spiral { from{transform:rotate(0deg);} to{transform:rotate(360deg);} } @keyframes ring-wobble { from{transform:rotate(-5deg);} to{transform:rotate(5deg);} } .node-tier { position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:7px;color:#8aa0b0;letter-spacing:0.8px;white-space:nowrap;background:rgba(5,7,15,0.9);padding:2px 6px;border-radius:10px;border:1px solid rgba(255,255,255,0.1); } .node-name { position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:9px;background:rgba(5,7,15,0.95);padding:2px 8px;border-radius:6px;opacity:0;transition:opacity 0.3s;white-space:nowrap;max-width:100px;text-align:center;zinct:15; } .neural-node:hover .node-name { opacity:1; } .node-cost { position:absolute;right:-16px;top:50%;transform:translateY(-50%);font-size:8px;background:#c864ff;color:#05070f;padding:1px 4px;border-radius:8px;font-weight:bold; } .neural-link { position:absolute;height:1px;background:linear-gradient(to right,rgba(200,100,255,0.2),rgba(200,100,255,0.6),rgba(200,100,255,0.2));transform-origin:left center;zinct:1;opacity:0;transition:opacity 0.5s; } .neural-link.active { opacity:0.4; box-shadow:0 0 5px #c864ff; } .detail-panel { position:fixed;right:20px;bottom:20px;width:240px;background:radial-gradient(ellipse at bottom,#0d1525,#05070f);border:1px solid rgba(200,100,255,0.3);border-radius:8px;padding:14px;box-shadow:0 10px 40px rgba(0,0,0,0.5);zinct:100;opacity:0;pointer-events:none;transition:all 0.3s; } .detail-panel.show { opacity:1; pointer-events:auto; } .detail-header { font-size:12px;color:#c864ff;font-weight:bold;margin-bottom:8px;letter-spacing:1px;border-bottom:1px solid rgba(200,100,255,0.2);padding-bottom:6px; } .detail-desc { font-size:10px;color:#aab0b0;line-height:1.5;margin-bottom:8px;min-height:60px; } .detail-cost { font-size:9px;color:#ffd700;background:rgba(255,215,0,0.15);padding:3px 8px;border-radius:4px;display:inline-block; } .bottom-pa const area = document.getElementById('neuralArea');

neuralNodes.forEach(node => {
  const el = document.createElement('div');
  el.className = 'neural-node '+(node.id.startsWith('n2')||node.id==='n213'?'available':'unlocked');
  el.style.left = (node.x * 90) + '%';
  el.style.top = (node.y * 80) + '%';
  el.style.setProperty('--node-color', node.color);
  el.style.setProperty('--node-rgb', node.rgb);
  el.style.setProperty('--node-color-glow', node.color);
  
  const icons = {'cmd':'◆','fp':'⚔','int':'♟','cw':'⚡'};
  el.innerHTML = `<div class="node-ring"><span style="color:${node.color}">${icons[node.type]||'?'}</span></div><div class="node-tier">${node.tier}</div><div class="node-name">${node.name}</div><div class="node-cost">${node.cost}点</div>`;

});

function showNeuralInfo(node) {
  const panel = document.getElementById('neuralDetail');
  document.getElementById('detailTitle').textContent = node.name;
  document.getElementById('detailDesc').textContent = node.desc;
  document.getElementById('detailCost').textContent = `需要 ${node.cost} 点`;
  panel.classList.add('show');
  setTimeout(() => panel.classList.remove('show'), 5000);
  document.getElementById('complexity').textContent = Math.floor(Math.random() * 8) + 3;
}

window.addEventListener('resize', () => {
  area.innerHTML = '';
  neuralNodes.forEach(node => {
    const el = document.createElement('div');
    el.className = 'neural-node '+(node.id.startsWith('n2')||node.id==='n213'?'available':'unlocked');
    el.style.left = (node.x * 90) + '%';
    el.style.top = (node.y * 80) + '%';
    el.style.setProperty('--node-color', node.color);

    el.style.setProperty('--node-color-glow', node.color);
