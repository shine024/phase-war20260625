<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>相位师技能树 - 方案F7：星域裂变式（全新设计）</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:radial-gradient(circle at center,#1a0b2e,#050010);color:#e0d4f0;font-family:'Microsoft YaHei',sans-serif;overflow:hidden;height:100vh}.scheme-label{position:fixed;top:10px;right:10px;background:rgba(255,120,180,0.2);border:1px solid rgba(255,120,180,0.5);color:#ff78b4;padding:5px 14px;border-radius:4px;font-size:12px;zinct:100;font-weight:bold}.fission-root{display:flex;justify-content:center;align-items:center;height:100vh}.fission-field{position:relative;width:85vmin;height:85vmin;animation:fission-warp 40s linear infinite;transform-style:preserve-3d}@keyframes fission-warp{0%{transform:scale(1) rotateY(0deg);}50%{transform:scale(1.05) rotateY(180deg);}100%{transform:scale(1) rotateY(360deg);}}.fission-cluster{position:absolute;width:120px;height:120px;border-radius:50%;border:2px dashed rgba(255,120,180,0.3);display:flex;align-items:center;justify-content:center;animation:fission-spin 20s infinite}.fission-cluster:nth-child(1){left:50%;top:50%;transform:translate(-50%,-50%) rotateY(45deg)}.fission-cluster:nth-child(2){left:50%;top:50%;transform:translate(-50%,-50%) rotateY(135deg) scale(0.8)}.fission-cluster:nth-child(3){left:50%;top:50%;transform:translate(-50%,-50%) rotateY(225deg) scale(0.6)}@keyframes fission-spin{from{transform:translate(-50%,-50%) rotateY(0deg);}to{transform:translate(-50%,-50%) rotateY(360deg);}}.fission-node{position:absolute;width:56px;height:56px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all 0.4s;transform-style:preserve-3d;zinct:8;border:2px solid;box-shadow:0 0 15px currentColor}.fission-node.unlocked{opacity:1;transform:scale(1)}.fission-node.locked{opacity:0.2;filter:blur(3px);transform:scale(0.6)}.fission-node.available{opacity:1;animation:fission-pulse 1.5s infinite alternate;transform:scale(1.2)}@keyframes fission-pulse{0%,100%{box-shadow:0 0 20px #ff78b4;}50%{box-shadow:0 0 50px #ff78b4,0 0 70px #ff78b4;}}.fission-core{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;background:radial-gradient(circle at 30% 30%,rgba(var(--node-rgb),0.3),transparent);border:2px solid var(--node-color);color:white;box-shadow:0 0 20px var(--node-color);position:relative;zinct:3}.fission-shard{position:absolute;width:8px;height:8px;background:#ff78b4;border-radius:50%;box-shadow:0 0 10px #ff78b4;animation:fission-fling 2s infinite alternate}@keyframes fission-fling{0%{transform:translate(0,0) scale(1);}100%{transform:translate(20px,-20px) scale(0.5);}}.fission-tier{position:absolute;top:-16px;font-size:7px;background:rgba(26,11,46,0.9);padding:2px 5px;border-radius:8px;letter-spacing:1px;zinct:4}.fission-name{position:absolute;bottom:-18px;font-size:9px;background:rgba(26,11,46,0.95);padding:2px 6px;border-radius:4px;opacity:0;transition:opacity 0.3s;white-space:nowrap;zinct:5}.fission-node:hover .fission-name{opacity:1}.fission-cost{position:absolute;right:-12px;top:50%;transform:translateY(-50%);font-size:7px;background:#ff78b4;color:#050010;padding:1px 4px;border-radius:6px;font-weight:bold;zinct:5}.top-bar{position:fixed;top:0;left:0;right:0;height:45px;background:linear-gradient(90deg,#1a0b2e,#2a0b3e,#1a0b2e);display:flex;align-items:center;justify-content:space-between;padding:0 24px;zinct:100}.fission-title{font-size:14px;color:#ff78b4;letter-spacing:2px;font-weight:bold;text-shadow:0 0 10px rgba(255,120,180,0.5)}.fission-stats{display:flex;gap:18px;font-size:10px;color:#8aa0b0}.fission-stats span{color:#ff78b4;font-weight:bold}</style></head><body><div class="scheme-label">方案 F7：星域裂变式（全新设计 - 28节点）</div><div class="top-bar"><div class="fission-title">⚛️ FISSION SKILL</div><div class="fission-stats"><div>碎片:<span>12</span></div><div>裂变:<span>7</span></div><div>层级:<span id="fission-level">3</span></div></div></div><div class="fission-root"><div class="fission-field" id="fissionField"><div class="fission-cluster"></div><div class="fission-cluster"></div><div class="fission-cluster"></div></div></div><script>const field=document.getElementById("fissionField");const fissionNodes=[{name:"指挥觉醒",desc:"单位上限+1",cost:1,angle:0,z:0,tier:"CORE",icon:"◆",color:"#ff78b4"},{name:"火力觉醒",desc:"攻击+8%",cost:1,angle:45,z:15,tier:"CORE",icon:"⚔",color:"#ffaa50"},{name:"智能核心",desc:"暴击+5%",cost:1,angle:90,z:15,tier:"CORE",icon:"♟",color:"#50ff78"},{name:"概念突破",desc:"能量+20%",cost:1,angle:135,z:15,tier:"CORE",icon:"⚡",color:"#7850ff"},{name:"基础防御",desc:"生命+15%",cost:1,angle:180,z:15,tier:"CORE",icon:"■",color:"#78ff50"},{name:"光学瞄准",desc:"精度+15%",cost:1,angle:225,z:15,tier:"CORE",icon:"🎯",color:"#50ff78"},{name:"战术学习",desc:"经验+20%",cost:1,angle:270,z:15,tier:"CORE",icon:"📚",color:"#ffaa50"},{name:"能量储备",desc:"开局满能量",cost:1,angle:315,z:15,tier:"CORE",icon:"⚡⚡",color:"#ffff50"},{name:"快速部署",desc:"速度+15%",cost:1,angle:22,z:50,tier:"TIER1",icon:"▶",color:"#ff8850"},{name:"战术规避",desc:"闪避+8%",cost:1,angle:"+67",z:50,tier:"TIER1",icon:"↗",color:"#50ff88"},{name:"穿甲弹道",desc:"穿透+20%",cost:1,angle:"+112",z:50,tier:"TIER1",icon:"➤",color:"#ff5550"},{name:"形态进化",desc:"卡牌进化",cost:1,angle:"+157",z:50,tier:"TIER1",icon:"🔄",color:"#8850ff"},{name:"指挥网络",desc:"光环增益",cost:2,angle:"+202",z:50,tier:"TIER1",icon:"◆◆",color:"#5088ff"},{name:"侦察视野",desc:"视野+30%",cost:1,angle:"+247",z:50,tier:"TIER1",icon:"👁️",color:"#50ffff"},{name:"智能火控",desc:"自动索敌",cost:2,angle:"+292",z:50,tier:"TIER1",icon:"🎯💡",color:"#ff88aa"},{name:"能量脉冲",desc:"周期爆发",cost:2,angle:"+337",z:50,tier:"TIER1",icon:"⚡⚡⚡",color:"#ffaa50"},{name:"领域统帅",desc:"三维防+12%",cost:3,angle:0,z:90,tier:"TIER2",icon:"◆◆◆",color:"#ff78b4"},{name:"纵深打击",desc:"射程+10%",cost:2,angle:45,z:90,tier:"TIER2",icon:"➢",color:"#ffaa50"},{name:"核爆打击",desc:"全体轰炸",cost:3,angle:90,z:90,tier:"TIER2",icon:"☢️",color:"#7850ff"},{name:"战略机动",desc:"战术跳跃",cost:2,angle:135,z:90,tier:"TIER2",icon:"🏃",color:"#78ff50"},{name:"终极护盾",desc:"全体无敌",cost:3,angle:180,z:90,tier:"TIER2",icon:"🛡️🛡️",color:"#ffff50"},{name:"指挥相位",desc:"战术核心",cost:2,angle:22,z:130,tier:"TIER3",icon:"◆⚙️",color:"#ff78b4"},{name:"火力相位",desc:"超弦阵列",cost:2,angle:"+67",z:130,tier:"TIER3",icon:"⚔️⚡",color:"#ffaa50"},{name:"智能相位",desc:"自主决策",cost:2,angle:"+112",z:130,tier:"TIER3",icon:"♟️🧠",color:"#50ff78"},{name:"概念相位",desc:"时空扭曲",cost:3,angle:"+157",z:130,tier:"TIER3",icon:"⚡⏳",color:"#7850ff"},{name:"终极裂变",desc:"全时代进化",cost:5,angle:"+180",z:170,tier:"ULT",icon:"⭐",color:"#ffd700"},{name:"维度终焉",desc:"掌控维度",cost:5,angle:"+225",z:170,tier:"ULT",icon:"🌌",color:"#ff78b4"}];fissionNodes.forEach(n=>{const el=document.createElement("div");const angleNum=typeof n.angle==="string"?n.angle.replace("+","")*1:n.angle;const rad=angleNum*Math.PI/180;const radius=n.tier==="ULT"?170:(n.tier==="TIER2"?90:(n.tier==="TIER1"?50:20));const x=Math.cos(rad)*radius;const y=Math.sin(rad)*radius;el.className="fission node "+(n.tier==="ULT"?"available":(n.tier==="CORE"?"unlocked":"locked"));el.style.setProperty("--node-color",n.color);el.style.setProperty("--node-rgb",n.color.replace("#",""));el.style.left=(50+x)+"%";el.style.top=(50+y)+"%";el.style.transform=`translateZ(${n.z}) rotateZ(${angleNum}deg)`;el.innerHTML=`<div class="fission-tier">${n.tier}</div><div class="fission-core"><span style="color:${n.color}">${n.icon}</span></div><div class="fission-name">${n.name}</div><div class="fission-cost">${n.cost}点</div>`;el.onclick=()=>alert("技能:\n"+n.name+"\n"+n.desc);field.appendChild(el);for(let i=0;i<2;i++){const shard=document.createElement("div");shard.className="fission-shard";shard.style.left=Math.random()*100+"%";shard.style.top=Math.random()*100+"%";shard.style.animationDelay=Math.random()*2+"s";el.appendChild(shard);}});</script></body></html>
