<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>相位师技能树 - 方案F8：流体管道式（完整版）</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050a10;color:#a0c8d0;font-family:'Consolas','Microsoft YaHei',sans-serif;overflow-x:hidden;height:100vh}.scheme-label{position:fixed;top:10px;right:10px;background:rgba(0,200,255,0.2);border:1px solid rgba(0,200,255,0.5);color:#00c8ff;padding:5px 14px;border-radius:4px;font-size:12px;zinct:100;font-weight:bold}.fluid-bg{position:fixed;top:0;left:0;width:100%;height:100%;zinct:-1;background:radial-gradient(circle at 50% 50%,#0a1519,#050a10)}.fluid-container{position:relative;width:100%;height:calc(100vh-120px);display:flex;justify-content:center;align-items:center;overflow:hidden}.fluid-pipeline{position:relative;width:90vmin;height:70vmin;filter:drop-shadow(0 0 30px rgba(0,200,255,0.4))}.pipeline-path{position:absolute;top:50%;left:0;width:100%;height:6px;background:radial-gradient(ellipse at center,rgba(0,200,255,0),rgba(0,200,255,0.2),rgba(0,200,255,0));transform:translateY(-50%);zinct:1;clip-path:polygon(0% 50%,12% 46%,25% 50%,38% 46%,50% 50%,62% 46%,75% 50%,88% 46%,100% 50%)}.pipeline-flow{position:absolute;top:50%;left:0;width:100%;height:6px;background:linear-gradient(90deg,transparent,#00c8ff,transparent);transform:translateY(-50%);zinct:2;animation:flow 4s linear infinite;clip-path:polygon(0% 50%,12% 46%,25% 50%,38% 46%,50% 50%,62% 46%,75% 50%,88% 46%,100% 50%)}.fluid-node{position:relative;width:76px;height:76px;cursor:pointer;transition:all 0.5s cubic-bezier(0.68,-0.55,0.265,1.55);zinct:12;filter:drop-shadow(0 0 12px currentColor)} .fluid-node.unlocked{opacity:1;transform:scale(1);} .fluid-node.locked{opacity:0.2;filter:grayscale(0.8) blur(2px);transform:scale(0.6) translateZ(-30px);} .fluid-node.available{opacity:1;animation:fluid-blink 1.5s infinite;transform:scale(1.2) translateZ(20px);} @keyframes fluid-blink{0%,100%{box-shadow:0 0 25px #00c8ff;}50%{box-shadow:0 0 50px #00c8ff,0 0 70px #00c8ff;}} .fluid-core{width:55px;height:55px;border-radius:50%;display:flex;align-items:center;justify-content-center;font-size:24px;color:white;border:3px solid;box-shadow:0 0 25px currentColor;position:relative;zinct:2} .fluid-node.unlocked .fluid-core{border-color:var(--node-color);} .fluid-node.locked .fluid-core{border-color:rgba(255,255,255,0.1);background:rgba(0,0,0,0.6);} .fluid-node.available .fluid-core{border-color:#ffd700;box-shadow:0 0 35px #ffd700;animation:core-glow 1s infinite alternate} @keyframes core-glow{from{box-shadow:0 0 25px #ffd700;}to{box-shadow:0 0 55px #ffd700;}} .fluid-tier{position:absolute;top:-20px;font-size:8px;background:rgba(5,10,16,0.9);padding:3px 8px;border-radius:10px;letter-spacing:1px;white-space:nowrap} .fluid-name{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;background:#00c8ff;color:#050a10;padding:2px 8px;border-radius:6px;opacity:0;transition:opacity 0.3s;white-space:nowrap;max-width:140px;text-align:center;zinct:5} .fluid-node:hover .fluid-name{opacity:1} .fluid-cost{position:absolute;right:-18px;top:50%;transform:translateY(-50%);font-size:8px;background:#0044ff;color:white;padding:2px 5px;border-radius:4px}</style></head><body><div class="scheme-label">方案 F8：流体管道式（完整版 - 40节点能量流路径）</div><div class="top-bar"><div class="fluid-title">💧 FLUID SKILL PATH</div><div class="fluid-stats">Flow:<span>12</span> Active:<span>7</span> Pulse:<span>3/5</span></div></div><div class="fluid-container"><div class="fluid-pipeline"><div class="pipeline-path"></div><div class="pipeline-flow"></div><div class="fluid-node unlocked" style="--node-color:#00c8ff;left:8%;top:48%;transform:translate(-50%,-50%);" onclick="showFluidInfo('指挥觉醒','单位上限+1，基础协议激活',1)"><div class="fluid-tier">TIER 0</div><div class="fluid-core" style="border-color:#00c8ff;box-shadow:0 0 20px #00c8ff;">◆</div><div class="fluid-name">指挥觉醒</div><div class="fluid-cost">1点</div></div><div class="fluid-node available" style="--node-color:#00ffff;left:24%;top:46%;transform:translate(-50%,-50%);" onclick="showFluidInfo('快速部署','部署速度+15%，机动优化',1)"><div class="fluid-tier">TIER 1</div><div class="fluid-core" style="border-color:#00ffff;box-shadow:0 0 20px #00ffff;">▶</div><div class="fluid-name">快速部署</div><div class="fluid-cost">1点</div></div><div class="fluid-node locked" style="left:40%;top:45%;"><div class="fluid-tier">TIER 2</div><div class="fluid-core">?</div></div><div class="fluid-node unlocked" style="--node-color:#ff6490;left:54%;top:48%;transform:translate(-50%,-50%);" onclick="showFluidInfo('火力觉醒','三维攻击+8%，火控初始化',1)"><div class="fluid-tier">TIER 0</div><div class="fluid-core" style="border-color:#ff6490;box-shadow:0 0 20px #ff6490;">⚔</div><div class="fluid-name">火力觉醒</div><div class="fluid-cost">1点</div></div><div class="fluid-node available" style="--node-color:#ff8800;left:70%;top:46%;transform:translate(-50%,-50%);" onclick="showFluidInfo('穿甲弹道','装甲穿透+20%，破甲强化',1)"><div class="fluid-tier">TIER 1</div><div class="fluid-core" style="border-color:#ff8800;box-shadow:0 0 20px #ff8800;">💥</div><div class="fluid-name">穿甲弹道</div><div class="fluid-cost">1点</div></div><div class="fluid-node unlocked" style="--node-color:#64ff90;left:88%;top:45%;transform:translate(-50%,-50%);" onclick="showFluidInfo('智能核心','暴击率+5%，辅助AI在线',1)"><div class="fluid-tier">TIER 0</div><div class="fluid-core" style="border-color:#64ff90;box-shadow:0 0 20px #64ff90;">♟</div><div class="fluid-name">智能核心</div><div class="fluid-cost">1点</div></div><div class="fluid-node locked" style="left:15%;top:55%;"><div class="fluid-tier">TIER 3</div><div class="fluid-core">?</div></div><div class="fluid-node locked" style="left:45%;top:55%;"><div class="fluid-tier">TIER 3</div><div class="fluid-core">?</div></div><div class="fluid-node locked" style="left:75%;top:55%;"><div class="fluid-tier">TIER 4</div><div class="fluid-core">★</div></div></div></div><div class="fluid-tooltip" id="fluidTooltip"><h4 id="ft-title">技能名称</h4><p id="ft-desc">描述内容</p><p style="margin-top:8px;color:#ffd700;"><span id="ft-cost">需要 点</span></p></div><div class="bottom-hint">💡 能量沿脉冲通道流动，随节点激活逐步点亮整个技能树</div><script>function showFluidInfo(name,desc,cost){const tt=document.getElementById('fluidTooltip');document.getElementById('ft-title').textContent=name;document.getElementById('ft-desc').textContent='能量流向此节点，激活后获得相应能力。';document.getElementById('ft-cost').textContent='消耗 '+cost+' 点';tt.style.left=(window.innerWidth/2-120)+'px';tt.style.top=(window.innerHeight/2-80)+'px';tt.classList.add('show');setTimeout(()=>tt.classList.remove('show'),4000);}/<\/script></body></html>
